<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Upsell Playbook — Reputifly</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" type="image/png" sizes="512x512" href="favicon.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
/* =========================================================================
   REPUTIFLY PROFESSIONAL -- the exact design system of Reputifly Mail.
   ========================================================================= */
:root {
  --color-canvas: #f7f8fa;
  --color-surface: #ffffff;
  --color-surface-2: #f3f4f6;
  --color-surface-3: #eceef1;
  --color-ink: #0a0a0a;
  --color-ink-2: #3f4754;
  --color-muted: #6b7280;
  --color-faint: #9ca3af;
  --color-line: #e8eaed;
  --color-line-2: #dfe2e7;
  --color-primary: #007aff;
  --color-primary-hover: #0a6fe0;
  --color-primary-active: #0563cc;
  --color-primary-soft: #e9f2ff;
  --color-on-primary: #ffffff;
  --color-success: #34c759;
  --color-warn: #ff9500;
  --color-danger: #ff3b30;
  --color-danger-hover: #e11d0f;
  --radius-pill: 9999px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 12px;
  --radius-xs: 9px;
  --shadow-xs: 0 1px 2px rgba(16, 24, 40, 0.04);
  --shadow-sm: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
  --shadow-md: 0 4px 12px rgba(16, 24, 40, 0.08), 0 2px 4px rgba(16, 24, 40, 0.04);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, 0.12), 0 4px 8px rgba(16, 24, 40, 0.06);
  --shadow-focus: 0 0 0 3px rgba(0, 122, 255, 0.28);
  --ease: cubic-bezier(0.25, 0.8, 0.25, 1);
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
html, body { margin: 0; min-height: 100vh; min-height: 100dvh; }
html {
  background: var(--color-canvas);
  color: var(--color-ink);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  font-feature-settings: "cv02", "cv03", "cv04", "cv11";
}
body {
  margin: 0; font-size: 14px; line-height: 1.5; letter-spacing: -0.006em;
  color: var(--color-ink); background: var(--color-canvas); overflow-x: hidden;
}
* { box-sizing: border-box; }
::selection { background: rgba(0, 122, 255, 0.16); }
h1, h2, h3, h4 { letter-spacing: -0.02em; font-weight: 700; margin: 0; }
a { color: var(--color-primary); text-decoration: none; }
a:hover { text-decoration: underline; }
:focus { outline: none; }
.btn:focus-visible, a:focus-visible, button:focus-visible, [tabindex]:focus-visible {
  box-shadow: var(--shadow-focus); border-radius: var(--radius-xs);
}
button { font-family: inherit; }
* { scrollbar-width: thin; scrollbar-color: #d3d6db transparent; }
*::-webkit-scrollbar { width: 10px; height: 10px; }
*::-webkit-scrollbar-thumb { background: #d3d6db; border-radius: 9999px; border: 3px solid transparent; background-clip: padding-box; }
*::-webkit-scrollbar-thumb:hover { background: #b9bdc4; background-clip: padding-box; }
*::-webkit-scrollbar-track { background: transparent; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 20px; border-radius: var(--radius-pill);
  border: 1px solid transparent; font-size: 14px; font-weight: 600; letter-spacing: -0.01em;
  cursor: pointer; user-select: none; white-space: nowrap;
  transition: background-color 0.18s var(--ease), border-color 0.18s var(--ease),
              color 0.18s var(--ease), transform 0.12s var(--ease), box-shadow 0.18s var(--ease);
}
.btn:active { transform: translateY(0.5px) scale(0.99); }
.btn--primary { background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--shadow-xs); }
.btn--primary:hover { background: var(--color-primary-hover); }
.btn--primary:active { background: var(--color-primary-active); }
.btn--ghost { background: var(--color-surface); color: var(--color-ink); border-color: var(--color-line-2); }
.btn--ghost:hover { background: var(--color-surface-2); }
.btn--sm { min-height: 36px; padding: 0 14px; font-size: 13px; gap: 6px; }
.card { background: var(--color-surface); border: 1px solid var(--color-line); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px;
  border-radius: var(--radius-pill); background: var(--color-surface-2);
  color: var(--color-ink-2); font-size: 12px; font-weight: 600;
}
.chip--primary { background: var(--color-primary-soft); color: var(--color-primary-active); }
@keyframes rf-pop-in { from { opacity: 0; transform: translateY(8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
.rf-pop-in { animation: rf-pop-in 0.22s var(--ease); }
@media (prefers-reduced-motion: reduce) { .rf-pop-in { animation: none; } }

/* ================= page-specific ================= */
.wrap { max-width: 720px; margin: 0 auto; padding: 0 16px 90px; }
.topbar {
  height: 60px; display: flex; align-items: center;
  border-bottom: 1px solid var(--color-line); background: var(--color-surface);
}
.topbar-inner { max-width: 720px; margin: 0 auto; padding: 0 16px; width: 100%; display: flex; align-items: center; }
.topbar img { height: 24px; width: auto; }

/* glass-ad ticks — same mark as the GLASS creative: colored circle, white stroke */
.ic {
  flex: 0 0 auto; width: 19px; height: 19px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.18);
}
.ic svg { width: 52%; height: 52%; display: block; }
.ic-tick { background: #25D366; }
.ic-x { background: var(--color-danger); }
.note--ic { display: flex; gap: 9px; align-items: flex-start; }
.note--ic .ic { margin-top: 1px; }

.sec-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--color-muted); margin: 30px 0 10px;
}
.qcard { padding: 24px 20px 20px; }
.qtitle { font-size: 25px; font-weight: 800; letter-spacing: -0.025em; margin-bottom: 16px; }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left;
  background: var(--color-surface); border: 1px solid var(--color-line-2);
  border-radius: var(--radius-md); padding: 14px 16px; margin-top: 9px;
  cursor: pointer; min-height: 60px; user-select: none; -webkit-user-select: none;
  transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), box-shadow 0.15s var(--ease), transform 0.15s var(--ease);
}
.opt:hover { background: var(--color-surface-2); box-shadow: var(--shadow-sm); }
.opt.on { background: var(--color-primary-soft); border-color: var(--color-primary); }
.opt .ot { font-size: 15px; font-weight: 650; color: var(--color-ink); letter-spacing: -0.012em; }
.opt .os { font-size: 12.5px; color: var(--color-muted); margin-top: 2px; }
.opt .b {
  width: 30px; height: 30px; border-radius: 9999px; color: #fff; font-size: 13px;
  font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; box-shadow: 0 2px 8px rgba(0,0,0,.14);
}

.play-card { border-left: 3px solid var(--color-primary); padding-bottom: 20px; }
.scen-head { display: flex; align-items: center; gap: 12px; padding: 20px 20px 4px; }
.scen-badge {
  width: 34px; height: 34px; border-radius: 9999px; display: inline-flex; align-items: center;
  justify-content: center; font-size: 16px; font-weight: 800; color: #fff; flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(0,0,0,.16);
}
.scen-title { font-size: 19px; font-weight: 750; letter-spacing: -0.022em; }
.scen-sub { padding: 2px 20px 6px; font-size: 13px; color: var(--color-muted); }

.step { padding: 16px 20px 4px; }
.step-h { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
.step-n {
  width: 23px; height: 23px; border-radius: 9999px; background: var(--color-primary);
  color: #fff; font-size: 12px; font-weight: 700; display: inline-flex;
  align-items: center; justify-content: center; flex-shrink: 0;
}
.step-t { font-size: 13.5px; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
.note { font-size: 12.5px; color: var(--color-muted); margin: 8px 2px 14px; line-height: 1.55; }
.note b { color: var(--color-ink-2); font-weight: 600; }

.msg {
  background: var(--color-surface-2); border: 1px solid var(--color-line);
  border-radius: var(--radius-md); padding: 13px 15px;
  font-size: 13.5px; line-height: 1.6; color: var(--color-ink); white-space: pre-wrap; word-break: break-word;
}
.dyn {
  background: var(--color-primary-soft); color: var(--color-primary-active);
  border: 1px dashed rgba(0,122,255,0.45); border-radius: 6px; padding: 0 4px; font-weight: 600;
}
.msg-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 36px; margin-bottom: 2px; }
.msg-head .who { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--color-faint); }

.wait { display: flex; align-items: center; gap: 12px; margin: 20px 20px 4px; }
.wait .line { flex: 1; height: 1px; background: var(--color-line-2); }
.wait .chip { background: #fff7ea; color: #b46603; border: 1px solid #ffe3bd; height: auto; min-height: 28px; padding: 4px 13px; text-align: center; line-height: 1.35; }

.obj { padding: 4px 20px 16px; }
.obj-item { border-bottom: 1px solid var(--color-line); }
.obj-item:last-child { border-bottom: none; }
.obj-q {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  background: transparent; border: none; padding: 15px 2px; cursor: pointer;
  font-size: 14.5px; font-weight: 600; color: var(--color-ink); min-height: 50px; letter-spacing: -0.012em;
}
.obj-q .car { margin-left: auto; color: var(--color-faint); transition: transform 0.18s var(--ease); flex-shrink: 0; font-size: 16px; }
.obj-item.open .obj-q .car { transform: rotate(90deg); }
.obj-body { display: none; padding: 0 2px 16px; }
.obj-item.open .obj-body { display: block; }
.obj-group {
  font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--color-faint); padding: 20px 2px 4px;
}
.rchips { display: flex; flex-direction: column; gap: 8px; margin: 6px 0 2px; }
.rchip {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  gap: 10px; text-align: left;
  border: 1px solid var(--color-line-2); background: var(--color-surface);
  border-radius: var(--radius-md); min-height: 48px; padding: 0 16px;
  font-size: 14px; font-weight: 650; color: var(--color-ink); cursor: pointer;
  letter-spacing: -0.012em; user-select: none; -webkit-user-select: none;
  transition: background-color 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
}
.rchip::after { content: "›"; color: var(--color-faint); font-size: 17px; flex-shrink: 0; }
.rchip:hover { background: var(--color-surface-2); }
.rchip.on { background: var(--color-primary-soft); border-color: var(--color-primary); color: var(--color-primary-active); }
.rchip.on::after { color: var(--color-primary); content: "✓"; font-size: 14px; }
.btn--block { width: 100%; justify-content: space-between; }
.btn--block::after { content: "›"; color: var(--color-faint); }
#reply-area { margin-top: 14px; }
.proof-img { width: 100%; height: auto; border: 1px solid var(--color-line); border-radius: var(--radius-md); display: block; margin-top: 10px; }

.hidden { display: none; }
@media (max-width: 480px) {
  .qtitle { font-size: 21px; }
  .scen-title { font-size: 17px; }
  .opt .b { width: 27px; height: 27px; font-size: 12px; }
  .btn--sm { min-height: 40px; padding: 0 16px; }
  .step, .obj { padding-left: 15px; padding-right: 15px; }
  .scen-head, .scen-sub { padding-left: 15px; padding-right: 15px; }
  .wait { margin-left: 15px; margin-right: 15px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <img src="reputifly-logo-black.png" alt="Reputifly" draggable="false" />
  </div>
</div>

<div class="wrap">

  <div style="height:26px;"></div>
  <div class="card qcard">
    <div class="qtitle">Which Client Is This?</div>
    <button class="opt" id="opt-a" onclick="pick('a')"><span class="b" style="background:#007aff">A</span><span><span class="ot">Just Closed — Deposit Paid, Build Starting</span><br/><span class="os">The main play. Pitch now, while the build is starting.</span></span></button>
    <button class="opt" id="opt-b" onclick="pick('b')"><span class="b" style="background:#34c759">B</span><span><span class="ot">Going Live Now — Never Pitched</span><br/><span class="os">Last easy moment. Full pitch.</span></span></button>
    <button class="opt" id="opt-d" onclick="pick('d')"><span class="b" style="background:#ff9500">D</span><span><span class="ot">Going Live Now — Said No At Play A</span><br/><span class="os">One personal message at the final price. That's all.</span></span></button>
    <button class="opt" id="opt-c" onclick="pick('c')"><span class="b" style="background:#3f4754">C</span><span><span class="ot">Already Live — Older Client</span><br/><span class="os">Full pitch. Leans on the 90-day re-test.</span></span></button>
  </div>

  <!-- SCENARIO -->
  <div id="scenario" class="hidden">
    <div class="sec-label">The Play</div>
    <div class="card play-card" id="scen-card"></div>
  </div>

  <!-- OBJECTIONS -->
  <div id="objections" class="hidden">
    <div class="sec-label" id="obj-label">After The Offer — What Did They Say?</div>
    <div class="card obj" id="obj-card"></div>
  </div>

</div>

<script>
var MSGS = {
  qualify: "We ran your business through ChatGPT, Gemini and Claude using *15 questions your customers actually ask before hiring someone.*\n\nYou were named in *«X» out of 45 answers*.\n\nThe «firms» that came up instead were mostly «Firm A» and «Firm B»\n\nDo you know them?",

  offerA: "Since we're building the new site right now, this is the cheapest time to do it.\n\nThe pages can be published and indexed together with the new site, instead of being added months later and waiting for everything to be re-crawled.\n\n15 pages answering those exact questions is *$499*, added directly into the current build.\n\nWant me to include it?",

  offerB: "Your site goes live soon, so this is the last point where it's easy.\n\nThe pages can go up with the launch and get indexed together with everything else, instead of being added after and waiting to be re-crawled.\n\n15 pages answering those exact questions is *$499*. I can put it on the same invoice as your balance so it's one payment.\n\nWant me to include it?",

  offerC: "Nothing on your site answers these 15 questions today.\n\nWe'd write all 15, publish them on your site, submit them to Google, and re-run this exact test in 90 days so you can see what moved.\n\n15 pages answering those exact questions is *$499*.\n\nWant me to do it?",

  reminderD: "Last one from me before we take your site live, then I'll leave it alone.\n\nYou passed on this earlier, which is fair. But honestly, I can't help but stress how important this one is, so I'll do it at *$299* — the full thing, all 15 pages plus the 90-day re-test.\n\nIf it's still a no, that's completely fine. We'll take you live as planned and I won't bring it up again.",

  bridge: "Ya. The AI answers from whatever pages exist online. «Firm A» has pages answering these questions, you don't yet. That's the part we can fix.",

  objThink: "Sure, no rush. The page that shows who got named instead of you is the one worth a minute.\n\nI'll check in with you «day».",

  objPartner: "Makes sense. Send them the report, way easier than explaining it.\n\nWhen are you seeing them?",

  objPark: "No problem at all, I'll leave it with you.\n\nOnly thing worth knowing: right now the pages go in with the build. Later they get added to a live site and wait to be re-crawled, so it's more work on your end later.",

  objParkD: "No worries at all, that's the last I'll mention it.",

  objWhat: "We build *15 extra pages* on your site targeting AI search — each one answers one of the questions we tested. We write them, publish them and submit them to Google. You won't have to do anything.\n\nThen we run the same test again in 90 days so you can see what changed.",

  objGuarantee: "Can't promise a position, that's Google's call not ours. What we guarantee is the 15 pages built, published and submitted to Google — and we re-test after 90 days so you see it either way.",

  objHold: "That $499 covers all 15 pages written, published and submitted to Google, plus we re-run the whole 45-answer test at 90 days.",

  obj399: "I can do *$399* for you. That's the lowest I can go on my end.",

  objBelow399: "Let me check with my boss and come back to you.",

  objYes: "Ok, settled. I'll add the *$499* to your invoice so it's one payment.\n\nTeam starts on the 15 pages, no change to your website timeline, and the 90-day re-test is on our calendar. Nothing needed from you.\n\nI'll message you when the pages are live.",

  objYesC: "Ok, settled. I'll send over the invoice for the *$499* now.\n\nTeam starts on the 15 pages, and the 90-day re-test is on our calendar. Nothing needed from you.\n\nI'll message you when the pages are live.",

  objYesD: "Ok, settled. I'll add the *$299* to the same invoice as your balance so it's one payment.\n\nTeam starts on the 15 pages, the 90-day re-test is on our calendar, and your site still goes live as planned. Nothing needed from you.",

  objFloorD: "That $299 is the floor, honestly. If it doesn't make sense at that, no stress — we'll wrap up as planned.",

  objSilence: "Might have caught you at a busy time. Want me to send over the full report so you can look when you're free?\n\nIf it's not a priority, no problem, I'll leave it there. Website side carries on as normal either way.",

  objSeo: "The website comes with the basics done, yes. This is separate work — 15 new pages, one for each question we tested, written, published and submitted to Google.\n\nThose pages don't exist yet, that's why they're not in the site price. The questions are all in the report.",

  objWhy590: "Fair question. The $590 is the website itself. This came out of the test we ran after — 15 extra pages on top of the site, so it's priced as its own piece of work.\n\nIf you skip it, the website doesn't change at all.",

  objNobody: "Maybe not your customers. But when we ran the test, «Firm A» and «Firm B» were the names coming back in the answers. If anyone does ask, that's who they're hearing about.\n\nAnd the pages sit on your normal website, they're not some separate AI thing. No pressure either way.",

  objProof: "Fair question — attached a short case study of one of our clients. Same question asked on ChatGPT, Google, Gemini and Claude, fresh chats, plus their actual Google traffic from Search Console.\n\nFor most of our clients on this system, around *80% of their Google traffic* comes from these pages.\n\nAnd you'll see it on your own numbers — we run the exact same 45-question test again at 90 days, side by side.",

  objEffort: "Nothing on your side. We write all 15 pages, publish them and submit them to Google ourselves.\n\nOnly thing I'll check with you is if a page touches your pricing or the areas you cover, so nothing goes up wrong. Two-minute thing on WhatsApp.",

  objHowLong: "Our part takes about a week — all 15 written, published and submitted in one go. If your site's still being built, they just go live together with it.\n\nAfter that Google indexes on its own schedule, that part nobody controls. That's why the re-test is at 90 days and not earlier.",

  objBusy: "Sure, no rush. I'll check in with you «day».",

  bridgeNo: "They're other «industry» firms serving the same area. The AI answers from whatever pages exist online — they have pages answering these questions, you don't yet. That's the part we can fix.",

  objOneTime: "One-time. The $499 covers all 15 pages written, published and submitted to Google, plus the full re-test at 90 days.\n\nNo monthly fee for this, and your hosting stays exactly as it is.",

  objOneTimeD: "One-time. The $299 covers all 15 pages written, published and submitted to Google, plus the full re-test at 90 days.\n\nNo monthly fee for this, and your hosting stays exactly as it is.",

  objCall: "Easier if I keep this in writing so you have everything to refer back to. What would you like me to run through? I'll answer everything here.",

  objThinkD: "Sure, take your time. Which day should I check back? I'll only come back on the day you give me.",

  objPartnerD: "No problem — everything's in that one message: all 15 pages plus the 90-day re-test, $299 on the same invoice as your balance.\n\nIt stands until we go live, then we take you live as planned either way.",

  objParkC: "No problem at all, I'll leave it with you. It's here if you ever want it.",

  objResendD: "Here's the report from when we ran your test. Same offer — all 15 pages plus the 90-day re-test, $299 on your balance invoice."
};

function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(raw){
  var h = esc(raw);
  h = h.replace(/\*([^*\n]+)\*/g, "<b>$1</b>");
  h = h.replace(/«([^»]+)»/g, '<span class="dyn">«$1»</span>');
  return h;
}
function copyMsg(btn, key){
  var raw = MSGS[key];
  function done(){
    var old = btn.textContent; btn.textContent = "Copied";
    setTimeout(function(){ btn.textContent = old; }, 1400);
  }
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(raw).then(done);
  } else {
    var ta = document.createElement("textarea");
    ta.value = raw; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch(e){}
    document.body.removeChild(ta);
  }
}
function togglePrev(btn){
  var el = btn.parentNode.nextElementSibling;
  var hid = el.classList.toggle("hidden");
  btn.textContent = hid ? "See The First Message" : "Hide The First Message";
}
function toggleReveal(btn, showTxt, hideTxt){
  var el = btn.parentNode.nextElementSibling;
  var hid = el.classList.toggle("hidden");
  btn.textContent = hid ? showTxt : hideTxt;
}

var REPLY_CHIPS_MAIN = [
  { id: "surp",     chip: "“Wah really?” / “I know them”" },
  { id: "dontknow", chip: "“Don’t know them” / “who are they?”" },
  { id: "fix",      chip: "“Can you fix it?” / “how much?”" },
  { id: "mean",     chip: "“What does this mean?”" },
  { id: "report",   chip: "“Send me the report”" },
  { id: "rank",     chip: "“Will we be number 1?”" },
  { id: "nobody",   chip: "“Nobody uses ChatGPT”" },
  { id: "call",     chip: "“Call me” / voice note" }
];
var REPLY_CHIPS_STALL = [
  { id: "busy",    chip: "“Busy now, talk later”" },
  { id: "notint",  chip: "“Not interested”" },
  { id: "silence", chip: "No reply after 1–2 days" }
];
var SEND_THEN_OFFER = "Send this, then the offer straight after — don't wait for another reply.";
function replyBody(id, s){
  switch(id){
    case "surp":
      return msgBlock("bridge","WhatsApp — the bridge") + tickNote(SEND_THEN_OFFER);
    case "dontknow":
      return msgBlock("bridgeNo","WhatsApp — «industry» = the same word used in the first message") + tickNote(SEND_THEN_OFFER);
    case "fix":
      return tickNote("No extra message — send the offer below, exactly as written, PDF attached. <b>Never type the price on its own</b> — the price only ever goes out inside the offer message.");
    case "mean":
      return msgBlock("bridge","WhatsApp — the bridge explains it") + tickNote(SEND_THEN_OFFER);
    case "report":
      return tickNote("They want the proof — send the offer below now, PDF attached. They get both at once.");
    case "rank":
      return msgBlock("objGuarantee","WhatsApp") + xNote("Never answer a ranking question with a yes.") + tickNote("Then the offer, straight after.");
    case "nobody":
      return msgBlock("objNobody","WhatsApp") + tickNote("Then the offer, straight after. Still doubting? The case study PDF is in the list at the bottom.");
    case "call":
      return msgBlock("objCall","WhatsApp — keep it in writing") + tickNote("Voice note? Listen to it, find the chip it matches, reply in text. Never call — everything stays in writing.");
    case "busy":
      return msgBlock("objBusy","WhatsApp — name a real day") + tickNote("<b>Stop here.</b> Check back on the day you named, then send the offer.");
    case "notint":
      return msgBlock(s === "a" ? "objPark" : "objParkC","WhatsApp") +
        (s === "a"
          ? xNote("<b>Stop. Park it, log it.</b> They get one reminder when the site goes live — that's play D. Nothing else, ever.")
          : xNote("<b>Stop. Park it, log it. That's the end for this client</b> — no reminder exists for a no at this stage."));
    case "silence":
      return msgBlock("objSilence","WhatsApp — one nudge, that's all") + xNote("<b>Stop and wait.</b> If nothing again, park it.");
  }
  return "";
}
var curScen = null;
function pickReply(btn, id){
  var chips = document.querySelectorAll(".rchip");
  for (var i = 0; i < chips.length; i++) chips[i].classList.toggle("on", chips[i] === btn);
  document.getElementById("reply-area").innerHTML = replyBody(id, curScen);
}
function chipsHtml(list){
  return '<div class="rchips">' + list.map(function(r){ return '<button class="rchip" onclick="pickReply(this, \''+r.id+'\')">'+r.chip+'</button>'; }).join('') + '</div>';
}

var IC_TICK = '<span class="ic ic-tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 12.4l5.2 5.2L19.8 7"/></svg></span>';
var IC_X = '<span class="ic ic-x"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5l14 14M19 5l-14 14"/></svg></span>';
function tickNote(txt){ return '<div class="note note--ic">'+IC_TICK+'<div>'+txt+'</div></div>'; }
function xNote(txt){ return '<div class="note note--ic">'+IC_X+'<div>'+txt+'</div></div>'; }

var SCEN = {
  a: { badge:"A", color:"#007aff", title:"Just Closed — Full Pitch",
       sub:"The main play. Send it the day the build starts — onboarding done, sitemap confirmed. Not deposit day, that's too many asks at once.",
       offer:"offerA",
       offerNote:"If yes — it goes on the current invoice, straight into the build." },
  b: { badge:"B", color:"#34c759", title:"Going Live — Full Pitch",
       sub:"Last moment the “goes in with the launch” reason is true.",
       offer:"offerB",
       offerNote:"If yes — same invoice as their balance, one payment." },
  c: { badge:"C", color:"#3f4754", title:"Already Live — Full Pitch",
       sub:"The back catalogue. The offer leans on the 90-day re-test instead of the launch.",
       offer:"offerC",
       offerNote:"If yes — new invoice for $499." },
  d: { badge:"D", color:"#ff9500", title:"They Said No At Play A — The Personal One",
       sub:"A-declines only — a no at B or C is final and gets no reminder. One honest message at $299, the final price and the final ask. It should read like you mean it, because you do.",
       offer:"reminderD",
       offerNote:"" }
};

function pick(s){
  ["opt-a","opt-b","opt-d","opt-c"].forEach(function(id){
    document.getElementById(id).classList.toggle("on", id === "opt-"+s);
  });
  showScenario(s);
}

function stepBlock(n, title, inner){
  return '<div class="step"><div class="step-h"><span class="step-n">'+n+'</span><span class="step-t">'+title+'</span></div>'+inner+'</div>';
}
function msgBlock(key, who){
  return '<div class="msg-head"><span class="who">'+who+'</span><button class="btn btn--ghost btn--sm" onclick="copyMsg(this, \''+key+'\')">Copy</button></div><div class="msg">'+fmt(MSGS[key])+'</div>';
}

function showScenario(s){
  curScen = s;
  var c = SCEN[s];
  var html = '<div class="scen-head"><span class="scen-badge" style="background:'+c.color+'">'+c.badge+'</span><span class="scen-title">'+c.title+'</span></div>'
           + '<div class="scen-sub">'+c.sub+'</div>';

  if (s === "d") {
    html += stepBlock(1, "Send The Personal One — That's The Whole Play", msgBlock("reminderD","WhatsApp — send as is"))
          + '<div style="padding:0 20px;">'
          + tickNote("If yes — $299 goes on the same invoice as their balance.")
          + xNote("If no — <b>that's forever.</b> Log it, never raise it again.")
          + '</div>';
  } else {
    html += stepBlock(1, "Send The Pack From The Box",
              '<div class="note" style="margin-top:0;">Run <b>/geo-audit</b> for this client — it gives you the results screenshot and the first message, already filled in. Send the screenshot, then the message, exactly as given.</div>'
            + '<div style="margin:2px 0 6px;"><button class="btn btn--ghost btn--sm btn--block" onclick="togglePrev(this)">See The First Message</button></div>'
            + '<div class="hidden"><div class="msg" style="margin-top:6px;">'+fmt(MSGS.qualify)+'</div></div>')
          + '<div style="padding:0 20px;">'
          + xNote("Blue parts not filled in? Don't send. It must name their real score and their real competitors.")
          + '</div>'
          + '<div class="wait"><span class="line"></span><span class="chip">WAIT FOR THEIR REPLY — their reply decides what comes next</span><span class="line"></span></div>'
          + stepBlock(2, "What Did They Reply? — Tap It",
              '<div class="note" style="margin-top:0;">Tap their reply. It shows what to send first — the offer always follows.<br/><b>Reply fits more than one?</b> If any part asks the price, go straight to the offer. Otherwise answer the doubt first, then the offer. One message, never two scripts pasted together.</div>'
            + chipsHtml(REPLY_CHIPS_MAIN)
            + '<div class="obj-group" style="padding:14px 2px 2px;">No Reply / Stalled / Out</div>'
            + chipsHtml(REPLY_CHIPS_STALL)
            + '<div id="reply-area"></div>')
          + stepBlock(3, "Send The Offer — Attach The PDF", msgBlock(c.offer,"WhatsApp — PDF attached to this one. The only message the PDF goes with, unless they asked for the report."))
          + '<div style="padding:0 20px;">'
          + tickNote(c.offerNote)
          + '</div>';
  }

  var card = document.getElementById("scen-card");
  card.style.borderLeftColor = c.color;
  card.innerHTML = html;
  card.classList.remove("rf-pop-in"); void card.offsetWidth; card.classList.add("rf-pop-in");
  document.getElementById("scenario").classList.remove("hidden");
  showObjections(s);
  setTimeout(function(){
    document.getElementById("scenario").scrollIntoView({behavior:"smooth", block:"start"});
  }, 60);
}

function objItem(id, q, bodyHtml, open){
  return '<div class="obj-item'+(open?' open':'')+'" id="obj-'+id+'">'
       + '<button class="obj-q" onclick="toggleObj(\''+id+'\')">'+q+'<span class="car">›</span></button>'
       + '<div class="obj-body">'+bodyHtml+'</div></div>';
}
function toggleObj(id){ document.getElementById("obj-"+id).classList.toggle("open"); }

function showObjections(s){
  var isD = (s === "d");
  var html = "";

  html += objItem("yes", "“Ok, go ahead”",
    msgBlock(isD ? "objYesD" : (s === "c" ? "objYesC" : "objYes"),"WhatsApp — send, invoice, stop talking") +
    tickNote("Restate the price and the next steps once, then stop. Invoice immediately — confirmation is payment."));

  html += '<div class="obj-group">Stalls</div>';

  if (isD) {
    html += objItem("think", "“Let me think about it”",
      msgBlock("objThinkD","WhatsApp — the client names the day, not you") +
      xNote("No date from the client = treat it as a no. Log it. Never follow up unprompted after the D message."));

    html += objItem("partner", "“I need to speak to my partner”",
      msgBlock("objPartnerD","WhatsApp") +
      xNote("Nothing gets re-attached, nothing gets re-pitched. The message stands until go-live, then it's over either way."));

    html += objItem("park", "“Not for now” / “not interested”",
      msgBlock("objParkD","WhatsApp") +
      xNote("<b>That's a final no.</b> Log it. This client is never pitched this again."));
  } else {
    html += objItem("think", "“Let me think about it”",
      msgBlock("objThink","WhatsApp") +
      tickNote("Always name a day, then actually check in that day. Same rule as leads."));

    html += objItem("partner", "“I need to speak to my partner”",
      msgBlock("objPartner","WhatsApp") +
      tickNote("The report does the explaining. Get the date, check in after it."));

    if (s === "a") {
      html += objItem("park", "“Not for now” / “not interested”",
        msgBlock("objPark","WhatsApp") +
        tickNote("Then park it. They get <b>one</b> reminder when the site goes live (that's play D). Never again after that."));
    } else {
      html += objItem("park", "“Not for now” / “not interested”",
        msgBlock("objParkC","WhatsApp") +
        xNote("<b>Park it, log it. That's the end for this client</b> — the go-live reminder only exists for play-A declines."));
    }
  }

  html += '<div class="obj-group">Price</div>';

  if (isD) {
    html += objItem("price", "“Can you go lower?”",
      msgBlock("objFloorD","WhatsApp") +
      xNote("<b>$299 is the floor, full stop.</b> Nothing below it exists, for anyone."));
  } else {
    html += objItem("price", "“Too expensive” / “can you do better?”",
      '<div class="note" style="margin-top:0;"><b>Step 1 — hold once at $499:</b></div>' +
      msgBlock("objHold","WhatsApp") +
      '<div class="note"><b>Step 2 — only if they push again:</b></div>' +
      msgBlock("obj399","WhatsApp") +
      '<div class="note"><b>Step 3 — they push below $399:</b></div>' +
      msgBlock("objBelow399","WhatsApp — send this, then message Julian and wait") +
      xNote("<b>$399 is your floor. Never name a number below it.</b> Julian decides anything lower — wait for his reply before saying anything else."));
  }

  html += '<div class="obj-group">Doubts</div>';

  html += objItem("guarantee", "“Can you guarantee it?” / “will we be number 1?”",
    msgBlock("objGuarantee","WhatsApp — same guard as step 2, the answer never changes") +
    xNote("Never answer a ranking question with a yes. If they keep pushing, use the promise script in the <a href=\"https://reputifly.org/closer-playbook#answer\" target=\"_blank\" rel=\"noopener\">closer playbook</a>."));

  if (!isD) {
    html += objItem("seo", "“Isn't SEO already included?”",
      msgBlock("objSeo","WhatsApp") +
      tickNote("Separate the deliverables, not the concepts — these 15 pages don't exist yet. Don't argue about what SEO means."));

    if (s === "a" || s === "b") {
      html += objItem("why590", "“Why isn't this in the $590?”",
        msgBlock("objWhy590","WhatsApp") +
        tickNote("The last line kills the added-on feeling — no penalty for saying no."));
    }

    html += objItem("proof", "“Does it actually work?” / “show me proof”",
      msgBlock("objProof","WhatsApp — send with the case study PDF attached") +
      '<div style="margin:10px 0 4px;"><a class="btn btn--ghost btn--sm btn--block" href="hairloft-case-study.pdf" target="_blank" rel="noopener">Open The Case Study PDF</a></div>' +
      tickNote("<b>Attach the PDF file itself on WhatsApp, not a link.</b> Open it, save it to your phone once, then attach it with this reply — never earlier in the flow.") +
      xNote("That's a real client. Never edit the PDF, never quote numbers beyond what's in it, never turn it into a promise — past results, not predictions."));
  }

  html += '<div class="obj-group">Questions They Might Ask</div>';

  html += objItem("onetime", "“Is this one-time or a monthly thing?”",
    msgBlock(isD ? "objOneTimeD" : "objOneTime","WhatsApp") +
    tickNote("One-time is the honest answer and the easy yes. Hosting stays untouched."));

  if (!isD) {
    html += objItem("what", "“What do we actually get?”",
      msgBlock("objWhat","WhatsApp") +
      tickNote("That's the whole product in two lines. Don't add more."));

    html += objItem("effort", "“Do I need to do anything?”",
      msgBlock("objEffort","WhatsApp") +
      tickNote("Zero work on their side is half the sale for a busy owner."));

    html += objItem("howlong", "“How long does it take?”",
      msgBlock("objHowLong","WhatsApp") +
      tickNote("Our clock is a week. Google's clock is nobody's — saying it now prevents chasing messages at week 2."));
  } else {
    html += objItem("resend", "“Send me the details again”",
      msgBlock("objResendD","WhatsApp — attach the ORIGINAL report PDF") +
      xNote("The original report only — <b>never run a fresh audit for a D client.</b>"));
  }

  document.getElementById("obj-card").innerHTML = html;
  document.getElementById("objections").classList.remove("hidden");
}
</script>
</body>
</html>
