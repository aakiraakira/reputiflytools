Missing information means the build cannot start, not proof of a fake buyer.\n\nA specific partner or finance dependency gets its actual next step. Apologising or replying slowly is not proof either way.","scripts":[{"n":"Real-but-cheap (grinds price but wants it), value proof, never discount","t":"the price is $590 for the website and seo setup, with hosting, domain and business email free for the first year. you've already seen the site we're building for you. that's the package","id":"s0"},{"n":"Confirmed time-waster (2+ tells), ONE warm exit, then let it decay","t":"no worries 🙂\nwe'll leave your site up a few days in case you change your mind 👍","id":"s1"}],"next":[{"l":"Invoice Out, Promises Broken","to":"payment"},{"l":"Real-But-Cheap → Value Proof","to":"close"},{"l":"Confirmed Waster → Warm Exit + Park","to":"park"}]},"park":{"title":"Parked: Let It Go","tag":{"x":"dead"},"label":"","do":"They never replied after the takedown, or they are a confirmed time-waster.\n\nThe preview is down. There is nothing left to sell them — and that is exactly why the one question below is worth sending.\n\n⛔ Never discount to save it. Never chase after this.\n\nThe probe is not for an explicit no/stop request, a lead who never replied, or an unpaid invoice governed by Payment. No fresh chase starts after it.","scripts":[{"n":"The silence probe — one shot, only after the takedown","t":"if possible, can you let us know why the sudden silence?","sit":"⚠️  *THE PREVIEW MUST ACTUALLY BE DOWN BEFORE THIS SENDS.* The message only works because you visibly have nothing left to sell.\n\n*USE WHEN all of these are true:*\n\n•  the ladder finished and they never replied\n•  they replied at least once earlier — a lead who never spoke gets nothing\n•  the takedown is done, not just announced\n\n⛔  *ONE SHOT. Never send it twice. Never add a reason, a reminder, or a price.*\nJudge it on whether they reply — never on whether they buy.","id":"s0"},{"n":"Only if they resurface later","t":"happy to spin it back up for you 🙂","id":"s1"}],"next":[{"l":"They Name A Blocker → Unstick It","to":"lever"},{"l":"They Name A Decision-Maker → Loop Them In","to":"followup"},{"l":"Back To Start","to":"newlead"}]},"tree":{"title":"The Decision Tree (Read This First)","tag":null,"label":null,"do":"⭐ *THE ONE RULE: never ask for the invoice before you've said the price.* forged body asked \"what about the rates?\" and got \"shall i send you the invoice?\" instead. gone by morning.\n\na tweak request = the *buy signal*. price + \"shall we start?\" go in ONE message. his answer picks the path:","treeHtml":"<div class=\"dt\"><div class=\"dt-card dt-g\"><div class=\"dt-t\">Sample Sent</div><div class=\"dt-s\">&ldquo;what do you think? anything you want to change, i&rsquo;ll sort it out&rdquo;</div></div><div class=\"dt-stem\"></div><div class=\"dt-card dt-teal\"><div class=\"dt-t\">He Likes It / Wants Changes</div><div class=\"dt-s\">The buy signal. Changes are simple, not free work. (Silent instead? Use the sample follow-up ladder)</div></div><div class=\"dt-stem\"></div><div class=\"dt-card dt-purple\"><div class=\"dt-t\">Message 1: Price + Confirmation, One Message</div><div class=\"dt-s\">&ldquo;the total price for the project is $590, we just require a 70% deposit which is $413. those changes are extremely easy, don&rsquo;t worry. shall we start the project?&rdquo;</div></div><div class=\"dt-stem\"></div><div class=\"dt-qq\">Did He Give A Clean Yes?</div><div class=\"dt-split\"></div><div class=\"dt-fork\"><div><div class=\"dt-drop\"></div><span class=\"dt-chip dt-chip-yes\">Yes</span><div class=\"dt-card dt-teal\"><div class=\"dt-t\">Message 2: Invoice Details</div><div class=\"dt-s\">&ldquo;perfect, what&rsquo;s the company name to put on the invoice?&rdquo; Then send the invoice, 70/30.</div></div></div><div class=\"dt-or\">or</div><div><div class=\"dt-drop\"></div><span class=\"dt-chip dt-chip-no\">No / Unsure / Others Involved</span><div class=\"dt-card dt-teal\"><div class=\"dt-t\">Resolve The Actual Next Step</div><div class=\"dt-s\">Question: answer it. Written quote: send it. Partner approval: send the site and a forwardable summary. Offer a Google Meet if it helps.</div><div class=\"dt-s2\">A clear yes plus a simple process question does not need another yes. Answer the question, then collect invoice details.</div></div></div></div><div class=\"dt-exc\">&#9889; The only exception: he is begging to pay from the start. Then you may skip the confirmation and go straight to the invoice, the price still goes in that same message.</div><div class=\"dt-rule\">&#9940; Never Ask For The Invoice Before The Price Is Said</div></div>","scripts":[{"t":"the total price for the project is *$590*, we just require a *70% deposit* which is *$413*\nthose changes are extremely easy, don't worry\n\nshall we start the project?","c":"","sit":"Message 1. Price + confirmation in ONE message. Send it the moment he says he likes it or wants changes.","id":"s0"},{"t":"perfect, what's the company name to put on the invoice?","c":"","sit":"Message 2. Only after a clean yes. Then send the invoice, 70/30.","id":"s1"}],"next":[{"l":"Send The Live Site","to":"reveal"},{"l":"Read Their Reaction","to":"telemetry"},{"l":"They're Ready → Close","to":"close"},{"l":"Needs A Written Quote","to":"close_asks"},{"l":"Needs A Call","to":"meet"},{"l":"Needs Partner Approval","to":"followup"}]},"cantalk":{"title":"They Can’t Talk Right Now","tag":{"x":"warm"},"label":"follow up","do":"*“i’m working” is NOT an objection and NOT a no. It is a scheduling problem, and the answer is a TIME, not more selling.*\n\nLoads of our leads physically cannot text while they work — tattoo artists mid-piece, contractors on site, hairdressers, installers. This is a whole category of buyer, not a one-off.\n\n⛔  Do not push again in the same hour. ⛔ Do not just say “ok no worries” and stop — that ends the conversation and leaves them nothing to come back to.\n\nBack off, give them something to do when they are free, and *name when you will come back.*","readClient":"Fires on: “i’m working” · “busy now” · “can’t talk” · “reply you later” · “give me a while”.\n\nStays the same label — they have not gone cold, they are at work. Use the actual day they gave. If none was given, suggest one reasonable check-in. Do not override a later agreed date.","scripts":[{"n":"Back off + leave an action + name the next touch","t":"no worries, have a look when you're free. i'll check back «agreed day»","sit":"Use their actual agreed day. If no sample exists, refer to the outstanding information instead of asking them to look at a site. Do not use tomorrow if they said next week.","id":"s0"}],"next":[{"l":"They Came Back → Read The Reaction","to":"telemetry"},{"l":"Still Nothing → Follow Up","to":"followup"}]},"spam_nosample":{"title":"10 Day Follow-Up: Sample NOT Sent","tag":{"x":"cool"},"label":"follow up","do":"⛔ *STOP THE LADDER THE MOMENT THEY REPLY, GIVE A DATE, SAY YES, OR SAY NO.* Use the Then What Happened? buttons at the bottom. Do not send the next rung.\n\n*They enquired but never gave you enough to build anything.* Every message below has ONE job: get the missing business name and trade so we can build. An existing website can already supply both. Once enough is known, stop this ladder and build.\n\n*COPY, SEND, MOVE ON. Follow the DAY NUMBERS, not one a day — days 1, 2, 3, 4, 6, 8, 10. Never the same one twice.*\n\n⭐ *THE FIRST LINE IS WHAT THEY SEE IN THE NOTIFICATION.* That line alone decides whether they open it, so it is always the hook. Do not add a greeting in front of it.\n\n⭐ *Each message does a DIFFERENT JOB* — ask, provoke, shrink the ask, offer an out, force a yes or no. Seven ways to say “any updates?” is seven ways to be ignored.\n\n⛔ Never two in one day. ⛔ Never change the price to get a reply. ⛔ Never promise rankings, leads or results.\n\n*Any reply at all = stop the sequence* and go read the temperature again.\n\nA genuine agreed date or booked call overrides this silence ladder. If an invoice is sent, leave this sequence and use [[Payment|payment]] only. Never send missed messages in a batch.","readClient":"Use this list only when there is no preview and information is still missing. Business name and trade are the minimum; an existing website may supply both. Logo and photos are optional. A complete brief waiting to be built is not a missing-information lead.","scripts":[{"n":"Day 1 — kill the effort","t":"just need your business name and what you do\n\nnothing to prepare","id":"s0"},{"n":"Day 2 — poke it","t":"if you've already got a website, send me the link. i can work from what's there","id":"s1"},{"n":"Day 3 — ask the real question","t":"is there something you'd like to check before we start?","id":"s2"},{"n":"Day 4 — one thing","t":"what's «the missing detail»? that's what i need before i can build it","id":"s3"},{"n":"Day 6 — flush the competitor","t":"have you already got someone working on the website?","id":"s4"},{"n":"Day 8 — shrink the ask","t":"send me «the missing detail» when you're ready and we can pick it up","id":"s5"},{"n":"Day 10 — ask for the no","t":"i'll leave it here for now. if you want to pick this up later, just message me","id":"s6"}],"next":[{"l":"They Sent Info → Get Their Info","to":"gotinfo"},{"l":"They Replied → Read Their Actual Message","to":"gotinfo"},{"l":"Hard No → Park","to":"park"},{"l":"Invoice Out, No Money Yet","to":"payment"},{"l":"They Are Ready → Close","to":"close"},{"l":"They Gave A Date → Honour It","to":"followup"},{"l":"Sequence Finished → Park","to":"park"}]},"spam_sample":{"title":"7 Day Follow-Up: Sample SENT","tag":{"x":"warm"},"label":"follow up","do":"⛔ *STOP THE LADDER THE MOMENT THEY REPLY, GIVE A DATE, SAY YES, OR SAY NO.* Use the Then What Happened? buttons at the bottom. Do not send the next rung.\n\n*Their site is built and live and they went quiet.* You have the strongest asset there is: their own website, already made. Point at it every time.\n\n*COPY, SEND, MOVE ON. Follow the DAY NUMBERS, not one a day — days 1, 2, 3, 5, 7, then 14. Never the same one twice.*\n\n⭐ *THE FIRST LINE IS WHAT THEY SEE IN THE NOTIFICATION.* That line alone decides whether they open it, so it is always the hook. Do not add a greeting in front of it.\n\n⭐ *Each message does a DIFFERENT JOB* — ask, provoke, shrink the ask, offer an out, force a yes or no. Six ways to say “any updates?” is six ways to be ignored.\n\n⛔ Never two in one day. ⛔ Never change the price to get a reply. ⛔ Never promise rankings, leads or results.\n\n*Any reply at all = stop the sequence* and go read the temperature again.\n⚠️ *IF DAY 7 LANDS FRI, SAT OR SUN, SEND THE WIND-DOWN THE NEXT MONDAY* and set « date » from there. Wind-down goes out Mon to Thurs only, never before a weekend.\n⚠️ *DAY 14 IS SEVEN DAYS AFTER THE WIND-DOWN, not a fixed date.* If the wind-down moved, the takedown moves with it. *Take it down for real on that day.* If you do not, the deadline stops working on every future lead.\n\nA genuine agreed date or booked call overrides this silence ladder. If an invoice is sent, leave this sequence and use [[Payment|payment]] only. Never send missed messages in a batch.","readClient":"Use this list when a live preview IS up. Always talk about *their* site, never about our offer. Day 7 is the wind-down and it has its own rules.","scripts":[{"n":"Day 1 — get a reaction","t":"had a chance to look through your site? let me know what you think of the design","id":"s0"},{"n":"Day 2 — the one that gets replies","t":"did you hate it?\n\ngenuinely, tell me what doesn't work for you","id":"s1"},{"n":"Day 3 — it's sitting there","t":"your site's live here: «link»\n\nworth a quick look?","id":"s2"},{"n":"Day 5 — hand them the pen","t":"what would you change?\n\ntell me the main thing you'd want different","id":"s3"},{"n":"Day 7 — THE WIND-DOWN (Mon to Thurs only)","t":"heads up, i'll take the website preview offline on «date» if we haven't confirmed the project by then\n\nif you want to pick it up later, just message me","sit":"Send on the sample ladder notice day, Monday to Thursday only. If it falls Friday to Sunday, move the notice to Monday and set takedown seven days after that. Use the real date and actually take the unpaid preview offline. A genuine later agreed date overrides the canned ladder.","id":"s4"},{"n":"Day 14: after the preview is actually offline","t":"the website preview is offline now. we've kept the work, so let me know if you'd like to pick it up again","id":"s5"}],"next":[{"l":"They Reacted → Read The Reaction","to":"telemetry"},{"l":"They're Ready → Close","to":"close"},{"l":"Hard No → Park","to":"park"},{"l":"Invoice Out, No Money Yet","to":"payment"},{"l":"They Gave A Date → Honour It","to":"followup"},{"l":"Sequence Finished → Park","to":"park"}]},"answered":{"title":"They Answered. Stop Talking.","do":"If they give a genuine answer, acknowledge it once and stop selling. Answer any actual question. Do not remove and repeat reactions to trigger notifications.\n\nOne exception: if they explicitly promised payment on a particular day and it is still unpaid later that day, use [[The promised-day reminder|answered/s0]] once. Do not send it if any payment reminder already went out that day. It replaces that day’s scheduled nudge; never send both. If it falls before the first scheduled nudge, it uses that nudge, so skip the later first nudge. Do not restart this exception every time they name a new date. Notice/offline dates stay unchanged unless a later date was agreed.","treeHtml":"<div class=\"ans-tbl-w\"><table class=\"ans-tbl\"><tr><th>They said</th><th>You do</th></tr><tr><td>&ldquo;payment will make today&rdquo;</td><td><span class=\"ans-rxi\">&#128077;</span>React. Send nothing.</td></tr><tr><td>&ldquo;don&rsquo;t rush, we need time to process&rdquo;</td><td><span class=\"ans-rxi\">&#128591;</span>React. Send nothing.</td></tr><tr><td>&ldquo;I&rsquo;ll get back to you&rdquo;</td><td class=\"ans-go\">Set the date. Then stop.</td></tr><tr><td>Nothing. No reply at all.</td><td class=\"ans-go\">Use the follow-up ladder for their current stage. Invoice out? Payment only.</td></tr></table></div><div class=\"ans-h\">After A Payment Update</div><div class=\"ans-cap\">Acknowledge once. If still unpaid later on the day they explicitly promised, use the single reminder below, under its conditions. Otherwise follow the Payment dates. No repeated reactions or duplicate pings.</div><div class=\"ans-h\">What this cost us</div><div class=\"ans-chat\"><div class=\"ans-t\">Client &middot; 10:10</div><div class=\"ans-b ans-them\">Payment will make today</div><div class=\"ans-t ans-r\">You &middot; 10:11</div><div class=\"ans-b ans-you ans-bad\">Okay thanks, will check in again with you after lunch so it&rsquo;s not on you to remember</div><div class=\"ans-flag ans-badf ans-r\">He already said yes. This asked him again.</div><div class=\"ans-t\">Client &middot; 10:23</div><div class=\"ans-b ans-them ans-hasrx\">Don&rsquo;t rush we need time to process<span class=\"ans-rx\">&#128591;</span></div><div class=\"ans-flag ans-badf\">We earned that. The reaction was right. It was one message too late.</div></div><div class=\"ans-cap\">What it should have been</div><div class=\"ans-chat\"><div class=\"ans-t\">Client &middot; 10:10</div><div class=\"ans-b ans-them ans-hasrx\">Payment will make today<span class=\"ans-rx\">&#128077;</span></div><div class=\"ans-flag ans-goodf\">One tap on his message. Nothing sent. He never has to reply again.</div></div>","scripts":[{"n":"Once, if still unpaid on the day they promised","t":"Hi thanks. Let me know when transferred","sit":"Check with Julian that payment has not arrived. Send later on the promised day, not immediately after their message. No earlier reminder that day. This uses the first nudge, rather than adding another. Never after a stop request, complaint, or a later agreed payment date.","id":"s0"}],"readClient":"*“Don’t rush” is not information. It is a complaint.*\n\nA client who has to slow you down is thinking about you instead of the payment.","next":[{"l":"Payment Dates And Full Rule","to":"payment"}]},"payment":{"title":"Invoice Out, No Money Yet","do":"The deposit starts the paid polish/revision process. The sample is already the first draft.\n\nThere are four scheduled touches: the invoice, nudge, notice and takedown confirmation. A genuine question, corrected invoice or necessary accounts detail still gets an answer. Use the scheduled dates, with only the promised-day exception below.\n\nNo new hosting concession after the invoice. Honour any extra hosting year already agreed. Cash discounts still need Julian's approval.\n\nDo not say an unpaid lead owes money. Before a payment reminder, use the existing payment check with Julian. Once money is in, reminders stop.\n\nA later agreed date can postpone the remaining reminders, not bring them forward. Keep their order and spacing rather than sending a batch after a delay.\n\nOne exception: if they explicitly promised payment on a particular day and it is still unpaid later that day, use [[The promised-day reminder|answered/s0]] once. Do not send it if any payment reminder already went out that day. It replaces that day’s scheduled nudge; never send both. If it falls before the first scheduled nudge, it uses that nudge, so skip the later first nudge. Do not restart this exception every time they name a new date. Notice/offline dates stay unchanged unless a later date was agreed.","treeHtml":"<div class=\"pay-w\"><div class=\"pay-h\">Read down. The first line that is true is what you do. Stop there.</div><table class=\"pay-t\"><tr><td class=\"pay-n\">1</td><td><b>Money is in</b></td><td class=\"pay-a\">Everything below is cancelled. Start paid polish/revisions and onboarding.</td></tr><tr><td class=\"pay-n\">2</td><td><b>They said any of:</b> stop, don&rsquo;t message, leave me alone, not interested, chasing me, harassing, spam</td><td class=\"pay-a pay-stop\">Send the STOP script. Never message again. Tell Julian.</td></tr><tr><td class=\"pay-n\">3</td><td><b>They sound angry or are complaining</b></td><td class=\"pay-a pay-stop\">Send nothing. Tell Julian. Wait.</td></tr><tr><td class=\"pay-n\">4</td><td><b>A new reply arrived</b></td><td class=\"pay-a\">Answer genuine questions or acknowledge the update. A later agreed date can postpone reminders, never bring them forward.</td></tr><tr><td class=\"pay-n\">5</td><td><b>Promised-day reminder is eligible</b></td><td class=\"pay-a\">Use the one reminder linked below. It replaces the first nudge, never adds a second one.</td></tr><tr><td class=\"pay-n\">6</td><td><b>The scheduled NUDGE, NOTICE or OFFLINE date is due today</b></td><td class=\"pay-a\">Send that message only if still due and unsent. Skip the first nudge if the promised-day reminder already replaced it.</td></tr><tr><td class=\"pay-n\">7</td><td><b>None of the above</b></td><td class=\"pay-a\">Send nothing.</td></tr></table><div class=\"pay-h\">The three dates. Write them in the watchlist the day the invoice goes out.</div><table class=\"pay-t pay-d\"><tr><th>They answered</th><th>NUDGE</th><th>NOTICE</th><th>OFFLINE</th></tr><tr><td><b>&ldquo;i pay it myself&rdquo;</b></td><td>+3 days</td><td>+8 days</td><td>+15 days</td></tr><tr><td><b>anything mentioning accounts, finance, admin, boss, approval</b></td><td>+5 days</td><td>+21 days</td><td>+30 days</td></tr></table><div class=\"pay-note\">Calendar days, not working days. If NOTICE or OFFLINE lands Fri, Sat or Sun, move it to the next Monday. ⛔ <b>No automatic reset when they name a date. Only the one promised-day nudge exception below may replace the first nudge.</b> A date they give can push yours later, never sooner.</div></div>","scripts":[{"n":"With the invoice: ask only if payer is unknown","sit":"Send with the invoice PDF only if it is not already clear who handles payment. Do not ask twice. Their answer selects the existing Payment date row.","t":"here's the invoice. do you handle the payment yourself, or does it go through your accounts?","id":"s0"},{"n":"2. THEY SAID IT GOES THROUGH ACCOUNTS — ask this once, then go quiet","sit":"Only if they named accounts, finance, admin or a boss and these details are still missing. Ask once, then wait for the scheduled nudge. Answer any genuine question that comes in.","t":"no problem\n\nwhat email should i send the pdf to for your accounts, and roughly when does your next payment run go out? i'll check back after that","id":"s1"},{"n":"Scheduled nudge: accounts payer","sit":"On the scheduled NUDGE date, when payment is handled by accounts. Keep this finance-unblock wording. Personal payers use the separate nudge below.","t":"morning «name»\n\nanything finance needs from me to release it? PO number, different entity, anything at all, i'll reissue today","id":"s2"},{"n":"NOTICE: unpaid preview goes offline on the real date","sit":"On the NOTICE date, Mon to Thu only. Name the real date. Do NOT add \"let me know if you need more time\".","t":"heads up, i'll take the website preview offline on «date» if the deposit hasn't arrived by then\n\nif you want to pick it up later, just message me","id":"s3"},{"n":"OFFLINE: after takedown, last scheduled follow-up","sit":"Only after the unpaid preview is actually offline. No extra chase or silence probe after this payment sequence. Answer a future inbound normally.","t":"the website preview is offline now. we've kept the work, so let me know if you'd like to pick it up again","id":"s4"},{"n":"⛔ STOP — they asked to be left alone","sit":"Fires on: stop, don't message, leave me alone, not interested, chasing me, harassing, spam. Send this, then never message them again, and tell Julian.","t":"understood, i'll leave it there\n\nif you ever want it, you know where i am","id":"s5"},{"n":"Scheduled nudge: personal payer","t":"hi «name», anything you need from me to go ahead with the deposit?","sit":"Only on the scheduled personal-payer nudge date. Do not send both nudge variants.","id":"s6"}],"readClient":"*A yes from someone who cannot pay is worse than a no.* If anyone other than the person you are texting has to approve the money, there is no deal yet — there is a request sitting in someone else's queue.\n\n*Finance is a process, not a person ignoring you.* A company pays when the invoice is in their system and a payment run happens. Chasing does not move a payment run. Asking what unblocks it does.\n\n*\"Don't rush\" and \"we need time\" are the last polite warning you get.* After that they stop replying.","next":[{"l":"Deposit Confirmed → Onboarding","to":"onboarding"},{"l":"Unpaid → Stay On Payment Dates","to":"payment"},{"l":"Dispute Or New Request → Check With Julian","to":"answer"}]}};

var sidescroll=document.getElementById("sidescroll"),detail=document.getElementById("detail");

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function waFmt(s){
  var e=esc(s);
  e=e.replace(/\*([^*\n]+)\*/g,"<b>$1</b>");
  e=e.replace(/«([^»]+)»/g,'<span class="fill">$1</span>');
  return e;
}

function staffFmt(s){
  return waFmt(s).replace(/\[\[([^\]|]+)\|([a-z0-9_/-]+)\]\]/g,function(_,label,path){return '<a class="staff-ref" href="#'+path+'" target="_blank" rel="noopener">'+label+' ↗</a>';});
}
function fnorm(s){return (s||"").toLowerCase().replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim();}
function flev(a,b){var m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;var dp=[],i,j;for(j=0;j<=n;j++)dp[j]=j;for(i=1;i<=m;i++){var prev=dp[0];dp[0]=i;for(j=1;j<=n;j++){var tmp=dp[j];dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1));prev=tmp;}}return dp[n];}
function fsub(q,w){var i=0,j=0;for(;j<w.length&&i<q.length;j++)if(q.charCodeAt(i)===w.charCodeAt(j))i++;return i===q.length;}
function ftok(tok,hayStr,words){
  if(hayStr.indexOf(tok)!==-1)return true;
  if(tok.length<3)return false;
  for(var k=0;k<words.length;k++){var w=words[k];if(!w)continue;
    if(w.indexOf(tok)===0)return true;
    if(tok.length>=4&&fsub(tok,w))return true;
    if(flev(tok,w)<=(tok.length<=5?1:2))return true;}
  return false;
}
function fmatch(f,hayStr,words){
  var toks=f.split(" ");
  for(var t=0;t<toks.length;t++){if(toks[t]&&!ftok(toks[t],hayStr,words))return false;}
  return true;
}
function renderSidebar(filter){
  var f=fnorm(filter),h="",shown=0,pending="";
  for(var i=0;i<MENU.length;i++){
    var m=MENU[i];
    if(m.g){pending='<div class="grouplabel">'+esc(m.g)+'<span class="gline"></span></div>';continue;}
    var hayStr=fnorm(m.tt+" "+m.ds+" "+(m.kw||"")),words=hayStr.split(" ");
    if(f&&!fmatch(f,hayStr,words))continue;
    if(pending){h+=pending;pending="";}
    h+='<button class="srow'+(m.id===curId?" active":"")+'" data-go="'+m.id+'"><div class="ic">'+m.ic+'</div>'+
       '<div class="tx"><div class="tt">'+esc(m.tt)+'</div><div class="ds">'+esc(m.ds)+'</div></div></button>';
    shown++;
  }
  if(!shown)h='<div class="noresult">No situation matches that.<br>Try another word.</div>';
  sidescroll.innerHTML=h;
}

function render(id){
  var n=NODES[id];if(!n)return;
  if(n.kind==="tagging"){renderTagging(id,n);return;}
  detail.classList.remove("welcomeview");
  curId=id;curScripts=(n.scripts||[]).map(function(s){return s.t;});
  var h='<div class="inner rf-fade-in">';
  h+='<div class="nodehd">'+esc(n.title)+'</div>';
  h+='<div class="metarow">';
  if(n.tag){var map={hot:["tag-hot","🔥 HOT"],warm:["tag-warm","WARM"],cool:["tag-cool","COOL"],dead:["tag-dead","HANDLE WITH CARE"]},t=map[typeof n.tag==="string"?n.tag:(n.tag&&n.tag.x)];if(t)h+='<span class="nodetag '+t[0]+'">'+t[1]+'</span>';}
  if(n.label){h+='<span class="labelpill"><span class="dot" style="background:'+(LABELCOLOR[n.label]||"#9ca3af")+'"></span>Label: '+esc(n.label)+'</span>';}
  h+='</div>';
  h+='<div class="doblk"><div><div class="lab">Do this</div><div class="tx" id="field-do">'+staffFmt(n.do)+'</div></div></div>';
  if(n.intake){
    h+='<div class="intakecard"><div class="lab">What To Gather (For A Smooth Start)</div><ul>';
    for(var k=0;k<n.intake.length;k++)h+='<li><span class="ck">'+TICK+'</span><span>'+waFmt(n.intake[k])+'</span></li>';
    h+='</ul></div>';
  }
  if(n.img){h+='<img class="proofimg" src="'+n.img+'" alt="proof"/>';if(n.imgcap)h+='<div class="proofcap">'+esc(n.imgcap)+'</div>';}
  if(n.treeHtml){h+=n.treeHtml;} if(n.scripts&&n.scripts.length)h+='<div class="sectlbl">What To Say</div>';
  if(n.combo)h+='<div class="combo"><div class="combohd">🔗 '+esc(n.combo)+'</div>';
  for(var i=0;i<(n.scripts||[]).length;i++){
    var s=n.scripts[i];
    if(s.route){h+='<div class="script-reference"><b>'+esc(s.n||'Use the existing answer')+'</b><p>'+staffFmt(s.sit||'')+'</p><a href="#'+s.route+'" target="_blank" rel="noopener">Open the copy message ↗</a></div>';continue;}
    if(s.n)h+='<div class="msgnum">'+esc(s.n)+'</div>';
    if(s.img)h+='<img class="proofimg" src="'+esc(s.img)+'" alt="included"/>';
    h+='<div class="scriptcard" id="script-'+(s.id||'s'+i)+'"><div class="scripthd"><span class="lbl">Tap to copy → paste in WhatsApp</span>'+
       '<button class="copybtn" data-act="copy" data-i="'+i+'">'+COPYICON+'Copy</button></div>'+
       (s.sit?'<div class="sitbar"><span class="sicon">📍</span><span>'+staffFmt(s.sit)+'</span></div>':'')+
       '<div class="scriptbody">'+waFmt(s.t)+'</div></div>';
  }
  if(n.combo)h+='</div>';
  if(n.asset){var As=Array.isArray(n.asset)?n.asset:[{src:n.asset,cap:"Save it once, then send it on WhatsApp."}];h+='<div class="asset"><div class="ahd">📎 Send when they ask what they get</div><div class="assetgrid">';for(var a=0;a<As.length;a++)h+='<div class="assetcol"><img src="'+As[a].src+'" alt="included"/><div class="acap">'+esc(As[a].cap)+'</div></div>';h+='</div></div>';}
  if(n.attachments){n.attachments.forEach(function(a){h+='<div class="asset-status"><b>'+esc(a.label)+'</b>';if(a.url){h+='<a class="btn btn--primary" href="'+esc(a.url)+'" download="'+esc(a.file||'Reputifly-Case-Study.pdf')+'" target="_blank" rel="noopener">⬇ Download the case study PDF</a><ol class="as-steps"><li>Tap download once. It saves to your phone.</li><li>In WhatsApp, tap the clip, pick <b>Document</b>, choose that file.</li><li><b>Send the file, never the link.</b> Send it with the reply above, not before.</li></ol>';}else{h+='<p>PDF pending. Use the value answer until it is attached. Once supplied, add its link here and remove this pending note.</p>';}h+='</div>';});}
  if(n.portfolioExamples){h+='<div class="portfolio-shortlist"><b>Choose one relevant project</b><ul>';n.portfolioExamples.forEach(function(p){h+='<li><a href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(p.industry)+' ↗</a></li>';});h+='</ul></div>';}
  if(n.next&&n.next.length){
    h+='<div class="nextlbl">Then What Happened?</div><div class="nexts">';
    for(var j=0;j<n.next.length;j++)h+='<button class="nextbtn" data-go="'+n.next[j].to+'"><span>'+esc(n.next[j].l)+'</span>'+ARROW+'</button>';
    h+='</div>';

  if(n.pending)h+='<div class="note">⚠️ '+esc(n.pending)+'</div>';
  else if(id==="reveal"||id==="hassite")h+='<div class="note">Highlighted bits like <span class="fill">link</span> are the only things you edit before sending.</div>';
  if(n.readClient)h+='<div class="rcard"><div class="lab">Read The Client</div><div class="tx">'+staffFmt(n.readClient)+'</div></div>';
  h+='</div>';
  detail.innerHTML=h;detail.scrollTop=0;
  setActive(id);window.scrollTo(0,0);
}

function tgChip(name,color){return '<span class="tg-chip" style="--tgc:'+color+'"><span class="tg-dot"></span>'+esc(name)+'</span>';}
function renderTagging(id,n){
  curId=id;curScripts=[];detail.classList.remove("welcomeview");
  var h='<div class="inner rf-fade-in">';

    if(st.swap){
      h+='<div class="tg-swaptxt"><span class="tg-rm">'+esc(st.swap[0][0])+'</span><span class="tg-arw">\u2192</span><span>swap to</span></div>';

  }
  h+='<div class="tg-doc"><div class="dh">\uD83D\uDCC7 The tracker doc \u2014 log the ones that matter</div><div class="dt">'+n.doctext+'</div><div class="drow"><a class="tg-doclink" href="'+n.docurl+'" target="_blank" rel="noopener">Open the tracker doc \u2197</a><button class="copybtn" data-act="copyurl" data-url="'+n.docurl+'">'+COPYICON+'Copy link</button></div></div>';

function copyUrl(u,btn){var o=btn.innerHTML;var done=function(){btn.classList.add("ok");btn.innerHTML="\u2713 Copied";toast("Doc link copied");setTimeout(function(){btn.classList.remove("ok");btn.innerHTML=o;},1400);};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done,function(){fallback(u,done);});else fallback(u,done);}
function go(id){
  var parts=id.split('/'),tag=parts.slice(1).join('/');id=parts[0];
  if(!NODES[id])return;
  if(!document.body.classList.contains("viewing")){listScroll=window.scrollY;navStack=[];}
  navStack.push(id);
  document.body.classList.add("viewing");
  detail.classList.remove("welcomeview");
  render(id);
  if(tag){_suppressHash=true;location.hash=id+'/'+tag;hlTag(tag);return;}
  var _cur=location.hash.slice(1);if(_cur!==id&&_cur.split("/")[0]!==id){_suppressHash=true;location.hash=id;}
}

function setActive(id){var rows=sidescroll.querySelectorAll(".srow");for(var i=0;i<rows.length;i++)rows[i].classList.toggle("active",rows[i].getAttribute("data-go")===id);}

function back(){navStack.pop();if(navStack.length){var pid=navStack[navStack.length-1];render(pid);if(location.hash.slice(1)!==pid){_suppressHash=true;location.hash=pid;}}else{document.body.classList.remove("viewing");renderWelcome();setActive(null);if(location.hash){_suppressHash=true;location.hash="";}window.scrollTo(0,listScroll);}}

function doCopy(i,btn){
  var raw=curScripts[i];if(raw==null)return;
  var done=function(){btn.classList.add("ok");btn.innerHTML="✓ Copied";toast("Copied, paste it in WhatsApp");setTimeout(function(){btn.classList.remove("ok");btn.innerHTML=COPYICON+"Copy";},1400);};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(raw).then(done,function(){fallback(raw,done);});else fallback(raw,done);
}
function fallback(t,cb){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(ta);cb();}

var toastT;
function toast(msg){var el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){el.classList.remove("show");},1700);}

document.addEventListener("click",function(e){
  var t=e.target.closest?e.target.closest("[data-go],[data-act]"):null;
  if(!t)return;
  if(t.hasAttribute("data-go")){go(t.getAttribute("data-go"));return;}
  var act=t.getAttribute("data-act");
  if(act==="back")back();
  else if(act==="copy")doCopy(parseInt(t.getAttribute("data-i"),10),t);
  else if(act==="copyurl")copyUrl(t.getAttribute("data-url"),t);
});

searchEl.addEventListener("input",function(){renderSidebar(searchEl.value);syncClear();});

function hlTag(tag){var old=document.querySelectorAll(".rev-hit");for(var q=0;q<old.length;q++)old[q].classList.remove("rev-hit");if(!tag)return;var nums=document.querySelectorAll(".msgnum"),first=null;for(var i=0;i<nums.length;i++){if(nums[i].textContent.indexOf("["+tag+"]")===0){var el=nums[i].nextElementSibling;while(el&&!el.classList.contains("scriptcard"))el=el.nextElementSibling;if(el){el.classList.add("rev-hit");if(!first)first=nums[i];}}}if(first)setTimeout(function(){first.scrollIntoView({behavior:"smooth",block:"center"});},90);}
function applyHash(){var raw=(location.hash||"").replace(/^#/,"");var p=raw.split("/");var id=p[0];var tag=p[1]||"";if(id&&NODES[id]){if(!(document.body.classList.contains("viewing")&&curId===id))go(id);hlTag(tag);}else if(document.body.classList.contains("viewing")){document.body.classList.remove("viewing");navStack=[];renderWelcome();setActive(null);window.scrollTo(0,0);}}
window.addEventListener("hashchange",function(){if(_suppressHash){_suppressHash=false;return;}applyHash();});
renderSidebar("");
renderWelcome();
applyHash();
