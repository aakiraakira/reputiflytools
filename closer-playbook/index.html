<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="color-scheme" content="light" />
<meta name="theme-color" content="#ffffff" />
<title>Reputifly · Closer Playbook</title>
<link rel="icon" href="favicon.png" />
<link rel="apple-touch-icon" href="favicon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
:root{
  --color-canvas:#f7f8fa;--color-surface:#ffffff;--color-surface-2:#f3f4f6;--color-surface-3:#eceef1;
  --color-ink:#0a0a0a;--color-ink-2:#3f4754;--color-muted:#6b7280;--color-faint:#9ca3af;
  --color-line:#e8eaed;--color-line-2:#dfe2e7;
  --color-primary:#007aff;--color-primary-hover:#0a6fe0;--color-primary-active:#0563cc;--color-primary-soft:#e9f2ff;--color-on-primary:#ffffff;
  --color-success:#34c759;--color-warn:#ff9500;--color-danger:#ff3b30;
  --radius-pill:9999px;--radius-lg:20px;--radius-md:14px;--radius-sm:12px;--radius-xs:9px;
  --shadow-xs:0 1px 2px rgba(16,24,40,.04);--shadow-sm:0 1px 3px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-md:0 4px 12px rgba(16,24,40,.08),0 2px 4px rgba(16,24,40,.04);--shadow-lg:0 12px 32px rgba(16,24,40,.12),0 4px 8px rgba(16,24,40,.06);
  --shadow-focus:0 0 0 3px rgba(0,122,255,.28);--ease:cubic-bezier(0.25,0.8,0.25,1);
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
html,body{margin:0;height:100%;}
html{background:var(--color-canvas);color:var(--color-ink);font-family:var(--font-sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-feature-settings:"cv02","cv03","cv04","cv11"}
body{margin:0;font-size:14px;line-height:1.5;letter-spacing:-0.006em;color:var(--color-ink);background:var(--color-canvas);overflow:hidden}
*{box-sizing:border-box}
::selection{background:rgba(0,122,255,.16)}
h1,h2,h3,h4{letter-spacing:-0.02em;font-weight:700;margin:0}
button{font-family:inherit}
:focus{outline:none}
button:focus-visible,[tabindex]:focus-visible{box-shadow:var(--shadow-focus);border-radius:var(--radius-xs)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:var(--radius-pill);border:1px solid transparent;font-size:14px;font-weight:600;letter-spacing:-0.01em;cursor:pointer;user-select:none;white-space:nowrap;transition:background-color .18s var(--ease),transform .12s var(--ease)}
.btn:active{transform:translateY(0.5px) scale(0.99)}
.btn--primary{background:var(--color-primary);color:var(--color-on-primary);box-shadow:var(--shadow-xs)}
.btn--primary:hover{background:var(--color-primary-hover)}
@keyframes rf-pop-in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rf-fade-in{from{opacity:0}to{opacity:1}}
.rf-fade-in{animation:rf-fade-in .2s var(--ease)}
@media (prefers-reduced-motion:reduce){.rf-fade-in{animation:none}}

/* app shell: header fixed, panes scroll = header always stuck */
.app{height:100dvh;display:flex;flex-direction:column;background:var(--color-canvas)}
.topbar{flex-shrink:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 22px;background:#fff;border-bottom:1px solid var(--color-line);z-index:30}
.topbar .logo{height:25px;width:auto;display:block}
.hback{display:none;align-items:center;justify-content:center;width:38px;height:38px;border-radius:50%;background:transparent;border:none;cursor:pointer;color:var(--color-ink);flex-shrink:0;margin-left:-8px;transition:background-color .14s var(--ease)}
.hback:hover{background:var(--color-surface-2)}.hback:active{background:var(--color-surface-3)}
.topbar .sep{width:1px;height:22px;background:var(--color-line-2)}
.topbar .title{font-size:15px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap}
.redpill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 16px;border-radius:var(--radius-pill);background:#ffe9e7;color:#c0271c;border:none;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background-color .15s var(--ease)}
.redpill:hover{background:#ffdcd8}
/* build stamp: lives in the topbar so it is readable from the welcome pane AND
   from inside a node, on both breakpoints, without overlaying either. */
.buildstamp{margin-left:auto;flex-shrink:0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--color-faint);background:var(--color-surface-2);border:1px solid var(--color-line);border-radius:var(--radius-pill);padding:3px 9px;line-height:1.35;white-space:nowrap;-webkit-user-select:all;user-select:all;cursor:text}
.buildstamp:empty{display:none}
.bodyrow{flex:1;display:flex;min-height:0}

/* sidebar */
.sidebar{width:362px;flex-shrink:0;border-right:1px solid var(--color-line);background:#fff;display:flex;flex-direction:column;min-height:0}
.searchwrap{padding:16px 16px 10px}
.search-pill{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 15px;background:var(--color-surface-2);border:1.5px solid transparent;border-radius:var(--radius-pill);transition:background-color .16s var(--ease),border-color .16s var(--ease)}
.search-pill.foc{background:#fff;border-color:var(--color-primary)}
.search-pill input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:15px;color:var(--color-ink);font-weight:500}
.search-pill input::placeholder{color:var(--color-faint);font-weight:400}
.clearbtn{display:none;flex-shrink:0;width:20px;height:20px;padding:0;border:none;border-radius:50%;background:var(--color-line-2);color:#fff;cursor:pointer;align-items:center;justify-content:center;transition:background-color .12s var(--ease)}
.clearbtn:hover{background:var(--color-faint)}
.clearbtn svg{width:11px;height:11px;display:block}
.search-pill.has-text .clearbtn{display:flex}
.sidescroll{flex:1;overflow-y:auto;padding:6px 14px 32px}
.grouplabel{font-size:13px;font-weight:800;letter-spacing:-0.01em;color:var(--color-ink);margin:22px 8px 9px;display:flex;align-items:center;gap:9px}
.grouplabel:first-child{margin-top:8px}
.grouplabel .gline{flex:1;height:1px;background:var(--color-line)}
.srow{display:flex;align-items:center;gap:13px;width:100%;text-align:left;padding:12px 13px;border-radius:var(--radius-md);background:transparent;border:1.5px solid transparent;cursor:pointer;transition:background-color .12s var(--ease),border-color .12s var(--ease);margin-bottom:3px}
.srow:hover{background:var(--color-surface-2)}
.srow.active{background:var(--color-primary-soft);border-color:#bcdcff}
.srow .ic{width:38px;height:38px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--color-surface-2);transition:background-color .12s var(--ease)}
.srow.active .ic{background:#fff}
.srow .tx{flex:1;min-width:0}
.srow .tt{font-size:14.5px;font-weight:600;letter-spacing:-0.015em;color:var(--color-ink);line-height:1.25}
.srow.active .tt{color:var(--color-primary-active)}
.srow .ds{font-size:12px;color:var(--color-muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.noresult{padding:34px 12px;text-align:center;color:var(--color-faint);font-size:13.5px;line-height:1.5}

/* detail */
.detail{flex:1;min-width:0;overflow-y:auto;padding:34px 44px 80px}
.detail .inner{max-width:720px;margin:0 auto}
.backbtn{display:none}
.detail.welcomeview{display:flex;align-items:center;justify-content:center;padding-top:34px;padding-bottom:34px}
.welcome{max-width:460px;margin:0 auto;text-align:center}
.welcome .wlogo{height:38px;margin-bottom:24px;opacity:.92}
.welcome h2{font-size:23px;font-weight:800;margin-bottom:10px;letter-spacing:-0.025em}
.welcome p{color:var(--color-muted);font-size:15px;line-height:1.65}
.nodehd{font-size:27px;font-weight:800;letter-spacing:-0.025em;line-height:1.18;margin:0 0 12px}
.metarow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.nodetag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:5px 12px;border-radius:var(--radius-pill);letter-spacing:.01em}
.tag-hot{background:#ffe9e7;color:#c0271c}.tag-warm{background:#fff1de;color:#9a5a00}.tag-cool{background:#e9f2ff;color:var(--color-primary-active)}.tag-dead{background:#f0f1f3;color:#6b7280}
.labelpill{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:5px 12px 5px 10px;border-radius:var(--radius-pill);background:var(--color-surface-2);color:var(--color-ink-2)}
.labelpill .dot{width:9px;height:9px;border-radius:50%}
.doblk{display:flex;gap:12px;padding:16px 18px;background:var(--color-primary-soft);border:1px solid #cfe3ff;border-radius:var(--radius-md);margin-bottom:18px}
.doblk .lab{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-primary-active);margin-bottom:5px}
.doblk .tx{font-size:14.5px;color:var(--color-ink);line-height:1.6;white-space:pre-wrap}
.doblk .tx b{font-weight:700}
.rcard{padding:15px 17px;background:#fff8ec;border:1px solid #ffe2b0;border-radius:var(--radius-md);margin-top:28px;margin-bottom:10px}
.rcard .lab{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9a5a00;margin-bottom:7px}
.rcard .tx{font-size:13.5px;color:#5c4a2b;line-height:1.6;white-space:pre-wrap}
.rcard .tx b{font-weight:800;font-size:15px;color:#7a4a12}
.intakecard{border:1px solid var(--color-line);border-radius:var(--radius-md);background:#fff;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-xs)}
.intakecard .lab{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-muted);margin-bottom:11px}
.intakecard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.intakecard li{display:flex;align-items:flex-start;gap:11px;font-size:14px;line-height:20px;color:var(--color-ink)}
.intakecard li .ck{width:20px;height:20px;border-radius:50%;background:#e9f7ee;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:0}
.intakecard li>span:last-child{padding-top:0}
.intakecard li b{font-weight:700}
.proofimg{width:100%;border:1px solid var(--color-line);border-radius:var(--radius-md);margin-bottom:8px;box-shadow:var(--shadow-sm);display:block}
.proofcap{font-size:12px;color:var(--color-muted);margin:0 2px 18px}
.sectlbl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-muted);margin:22px 2px 11px}
.msgnum{font-size:13.5px;font-weight:700;color:var(--color-primary-active);margin:0 2px 8px;letter-spacing:-0.01em}
.scriptcard{border:1px solid var(--color-line);border-radius:var(--radius-md);overflow:hidden;margin-bottom:14px;background:#fff;box-shadow:var(--shadow-xs)}
.scripthd{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--color-surface-2);border-bottom:1px solid var(--color-line)}
.scripthd .lbl{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--color-muted)}
.scriptbody{padding:16px;font-size:15px;line-height:1.6;color:var(--color-ink);white-space:pre-wrap}
.scriptbody b{font-weight:700}
.sitbar{display:flex;gap:7px;align-items:flex-start;padding:9px 14px 10px;background:#fff8ec;border-bottom:1px solid #ffe2b0;font-size:11.5px;font-weight:600;color:#9a5a00;line-height:1.45}
.sitbar .sicon{flex-shrink:0;font-size:12px;line-height:1.3}.sitbar>span:last-child{white-space:pre-line}
.combo{border:1.5px solid #bcdcff;border-radius:var(--radius-md);padding:11px 12px 3px;margin-bottom:14px;background:#f4f9ff}
.combohd{font-size:12px;font-weight:800;letter-spacing:.01em;color:var(--color-primary-active);margin:1px 2px 11px;display:flex;align-items:center;gap:6px}
.copybtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--radius-pill);background:var(--color-primary);color:#fff;border:none;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background-color .15s var(--ease),transform .12s var(--ease)}
.copybtn:hover{background:var(--color-primary-hover)}.copybtn:active{transform:scale(.97)}
.copybtn.ok{background:var(--color-success)}
.fill{background:#fff4c2;border-radius:4px;padding:0 4px;font-weight:600;color:#8a6d00}
.asset{border:1px solid var(--color-line);border-radius:var(--radius-md);background:#fff;padding:14px;margin-bottom:14px;box-shadow:var(--shadow-xs)}
.asset .ahd{font-size:12px;font-weight:700;color:var(--color-ink-2);margin-bottom:11px;display:flex;align-items:center;gap:7px}
.asset .assetgrid{display:flex;gap:14px}
.asset-status{margin:14px 0 6px;padding:15px 16px 14px;border:1px solid var(--color-line);border-radius:var(--radius-md);background:var(--color-surface-2)}
.asset-status b{display:block;font-size:14px;color:var(--color-ink);margin-bottom:10px}
.asset-status p{margin:0;font-size:13px;line-height:1.55;color:var(--color-muted)}
.asset-status .btn{width:100%;margin-bottom:10px}
.asset-status .as-steps{margin:0;padding-left:17px;font-size:13px;line-height:1.65;color:var(--color-muted)}
.asset-status .as-steps b{display:inline;font-size:13px;color:var(--color-ink);margin:0}
.asset .assetcol{flex:1;min-width:0}
.asset .assetcol img{width:100%;border-radius:10px;border:1px solid var(--color-line);display:block;box-shadow:var(--shadow-sm)}
.asset .acap{font-size:12px;color:var(--color-muted);margin-top:9px;line-height:1.5}
.nextlbl{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--color-muted);margin:26px 2px 11px}
.nexts{display:flex;flex-direction:column;gap:9px}
.nextbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--color-line-2);border-radius:var(--radius-md);background:#fff;font-size:14px;font-weight:600;color:var(--color-ink);cursor:pointer;transition:background-color .13s var(--ease),border-color .13s var(--ease),transform .12s var(--ease)}
.nextbtn:hover{background:var(--color-surface-2);border-color:var(--color-primary)}
.nextbtn:active{transform:scale(.995)}
.nextbtn .arw{color:var(--color-primary);flex-shrink:0}
.note{font-size:12.5px;color:var(--color-muted);margin-top:18px;padding:12px 14px;background:var(--color-surface-2);border-radius:var(--radius-sm);line-height:1.55}

.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.42);display:flex;align-items:center;justify-content:center;padding:16px;animation:rf-fade-in .18s var(--ease)}
@media(max-width:560px){.scrim{align-items:flex-end;padding:0}}
.sheet{width:100%;max-width:540px;background:#fff;border-radius:20px;box-shadow:var(--shadow-lg);padding:10px 22px 28px;animation:rf-fade-in .2s var(--ease)}
@media(max-width:560px){.sheet{border-radius:20px 20px 0 0}}
.sheet .grab{width:38px;height:4px;border-radius:9999px;background:var(--color-line-2);margin:8px auto 16px}
.sheet h2{font-size:18px;font-weight:800;margin-bottom:4px}
.sheet .sh-sub{font-size:13px;color:var(--color-muted);margin-bottom:16px}
.rl{display:flex;gap:12px;padding:13px 0;border-top:1px solid var(--color-line)}
.rl .n{width:25px;height:25px;border-radius:8px;background:var(--color-danger);color:#fff;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.rl .t{font-size:14px;line-height:1.5}.rl .t b{font-weight:700}
.rl .t .fill{font-weight:700}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);z-index:80;background:var(--color-ink);color:#fff;font-size:13.5px;font-weight:600;padding:12px 20px;border-radius:var(--radius-pill);box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .2s var(--ease)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:860px){
  .bodyrow{display:block;overflow-y:auto}
  .app{height:auto;min-height:100dvh}
  body{overflow:auto}
  .topbar{position:sticky;top:0;padding:0 16px;gap:10px}
  .topbar .logo{transform:translateY(0.5px)}
  body.viewing .hback{margin-left:-16px;transform:translateY(-1.5px)}
  .sidebar{width:100%;border-right:none}
  .sidescroll{overflow:visible}
  .detail{display:none;padding:20px 16px 60px;overflow:visible}
  .detail .inner{max-width:100%}
  body.viewing .sidebar{display:none}
  body.viewing .detail{display:block}
  .backbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px 0 10px;border-radius:var(--radius-pill);background:var(--color-surface-2);color:var(--color-ink-2);font-size:13px;font-weight:600;border:none;cursor:pointer;margin-bottom:16px}
  .topbar .title,.topbar .sep{display:none}
  .buildstamp{font-size:10px;padding:2px 8px}
  body.viewing .topbar .hback{display:inline-flex}
  .asset .assetgrid{flex-direction:column;gap:18px}
}

/* Tagging Convention */
.tg-lead{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:#e7f8f6;border:1px solid #b7e7e2;border-radius:var(--radius-md);margin-bottom:20px}
.tg-lead .ti{font-size:17px;line-height:1.3;flex-shrink:0}
.tg-lead .tt{font-size:14px;line-height:1.55;color:#0c5f59}
.tg-lead .tt b{font-weight:800;color:#0a4d48}
.tg-step{border:1px solid var(--color-line);border-radius:var(--radius-md);background:#fff;box-shadow:var(--shadow-xs);padding:15px 16px 16px;margin-bottom:12px}
.tg-when{display:flex;align-items:flex-start;gap:11px;font-size:15px;font-weight:700;letter-spacing:-0.015em;color:var(--color-ink);line-height:1.4}
.tg-num{width:26px;height:26px;border-radius:50%;background:var(--color-ink);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tg-sub{font-weight:500;color:var(--color-muted);font-size:12.5px;display:block;margin-top:3px}
.tg-body{padding-left:37px;margin-top:11px;display:flex;flex-direction:column;gap:9px}
.tg-chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tg-chip{display:inline-flex;align-items:center;gap:9px;padding:8px 15px 8px 12px;border-radius:var(--radius-pill);font-weight:700;font-size:14px;color:var(--color-ink);background:#fff;background:color-mix(in srgb, var(--tgc) 9%, #fff);border:1.5px solid var(--color-line-2);border-color:color-mix(in srgb, var(--tgc) 34%, #fff);box-shadow:var(--shadow-xs)}
.tg-chip .tg-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;background:var(--tgc)}
.tg-swaptxt{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--color-muted);font-weight:600}
.tg-swaptxt .tg-rm{text-decoration:line-through;text-decoration-color:#c4c8ce}
.tg-arw{color:var(--color-faint)}
.tg-note{font-size:12.5px;color:var(--color-muted);line-height:1.5}
.tg-note b{font-weight:700;color:var(--color-ink-2)}
.tg-why{font-size:12.5px;color:var(--color-muted);line-height:1.55;border-left:2px solid var(--color-line-2);padding:2px 0 2px 11px}
.tg-why .wl{display:block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--color-faint);margin-bottom:3px}
.tg-lognote{display:inline-flex;align-items:center;gap:8px;margin-top:3px;padding:9px 14px;background:#f4f8ff;border:1px solid #cfe1fb;border-radius:var(--radius-pill);font-size:12.5px;font-weight:700;color:#1a73e8;text-decoration:none;width:max-content;max-width:100%;transition:background-color .14s var(--ease)}
.tg-lognote:hover{background:#e8f1fe}
.tg-lognote .lga{font-weight:800;font-size:14px}
.tg-doc{border:1.5px solid #cfe3ff;background:#f4f9ff;border-radius:var(--radius-md);padding:15px 16px;margin:22px 0 8px}
.tg-doc .dh{font-size:12.5px;font-weight:800;color:var(--color-primary-active);display:flex;align-items:center;gap:7px;margin-bottom:8px}
.tg-doc .dt{font-size:13.5px;color:var(--color-ink);line-height:1.6;margin-bottom:13px}
.tg-doc .dt b{font-weight:700}
.tg-doc .drow{display:flex;flex-wrap:wrap;gap:9px}

<script>
/* Cache buster. version.txt is the source of truth; bump BOTH on every push.
   If the deployed version differs from the one baked into this file, reload ONCE
   with a matching ?v= so a stale copy can never persist. Guarded against loops.

   PB_BUILD is declared ONCE here and is the only place this value is written.
   The visible build stamp in the topbar is printed from this same variable, so
   what you read on the page is always the build the cache buster is comparing
   against — the stamp cannot drift from the behaviour. */
var PB_BUILD="20260909-2";
(function(){try{
fetch("version.txt?_="+Date.now(),{cache:"no-store"})
.then(function(r){return r.ok?r.text():null;})
.then(function(v){if(!v)return;v=v.trim();
 if(!v||v===PB_BUILD)return;
 if(sessionStorage.getItem("pbReload")===v)return;
 sessionStorage.setItem("pbReload",v);
 location.replace(location.pathname+"?v="+encodeURIComponent(v)+location.hash);})
.catch(function(){});}catch(e){}})();
</script>

var NODES={"answer":{"title":"What Are They Actually Asking?","do":"Before you reply, work out which one of three things they are asking for.\n\nSEO setup included? Use [[Included SEO setup|faq/s21]].\nOnly looking for SEO or ads, not a website? Clarify that separate enquiry; do not force a website close.\nA website buyer asks about a separate service? Use the website-first message below.\nRefund or cancellation question? Flag Julian so he can take over.","readClient":"*Don’t know a STATE answer?* It becomes a PROMISE. Ask Julian, never guess.\n\n*Asked twice?* You missed one. Re-read their last 3 messages and answer everything outstanding in one reply.\n\n*They already replied?* Stop pushing. See *They Answered. Stop Talking.*","scripts":[{"n":"Website buyer asks about a separate additional service","t":"that's a separate service. let's get your website up first though, it's the base for all of it.\n\nwe can discuss the rest after.","sit":"Use for a website buyer asking about an additional service. Not for “is SEO setup included?” and not for someone who only wants SEO or ads. Answer included setup in Common Questions. Do not redirect an ads question to an unasked AI-search offer.","id":"s0"},{"n":"They only want SEO or ads, not a website","t":"got it, you're looking for «seo / ads» rather than a new website. send me your current website and what you're looking to improve, and i'll check what we can offer","sit":"Ask only for information not already supplied. Check the actual service before offering scope or pricing.","id":"s1"},{"n":"Refund or cancellation: holding reply if needed","t":"understood, i'll get this checked and come back to you on the next step","sit":"Flag Julian and let him take over. Do not improvise terms, grant a refund or send an absolute refusal.","id":"s2"}],"treeHtml":"<div class=\"bkt\"><div class=\"bkt-r bkt-do\"><div class=\"bkt-c1\"><span class=\"bkt-tag\">Do</span></div><div class=\"bkt-a\"><span>&ldquo;can you change the logo?&rdquo;</span><span>&ldquo;make it brighter&rdquo;</span><span>&ldquo;move that section up&rdquo;</span><span>&ldquo;take that photo out&rdquo;</span></div><div class=\"bkt-y\">&ldquo;yes, easy&rdquo;</div></div><div class=\"bkt-r bkt-st\"><div class=\"bkt-c1\"><span class=\"bkt-tag\">State</span></div><div class=\"bkt-a\"><span>&ldquo;how much is hosting?&rdquo;</span><span>&ldquo;how long does it take?&rdquo;</span><span>&ldquo;do we own the website?&rdquo;</span><span>&ldquo;what happens if we move hosting?&rdquo;</span></div><div class=\"bkt-y\">the exact answer, nothing vague</div></div><div class=\"bkt-r bkt-pr\"><div class=\"bkt-c1\"><span class=\"bkt-tag\">Promise</span></div><div class=\"bkt-a\"><span>&ldquo;can you get us to no.1?&rdquo;</span><span>&ldquo;how fast will we rank?&rdquo;</span><span>&ldquo;will this bring us customers?&rdquo;</span></div><div class=\"bkt-y\">answer the question directly; do not promise an outcome</div></div></div>"},"spammer":{"title":"They Keep Sending Changes","tag":{"x":"warm"},"label":"warm","do":"*They are not wasting your time. They are art-directing a site they have already decided to buy.* Nobody picks the logo frame on a website they are not going to pay for.\n\n*THE SPLIT*\n\n*QUESTIONS* — price, hosting, ownership, timeline, what’s included → answer them, fast, always. Never park a question.\n\n*CHANGE REQUESTS* — move this, drop that word, our logo, this colour → log them, never action them, never debate them.\n\n⛔ *STOP replying “yeah we can do that” to each one.* Every yes invites the next request. You say yes ONCE — with the message below — then every request after that gets the one-liner.\n\n⛔ *NEVER sound annoyed.* This is the most engaged lead in your pipeline. Annoyance is the only thing that loses this deal.\n\n*Still not stopping after the message?* Open *The Decision Tree* and send the price close from there. Same close as every other deal — never rewrite it here.\n\n⭐ *They push for ONE small change before paying, and they ASKED for it?* Do that one thing so they can see it, then straight back to confirming. Never offered by you, never a list, and never “here are all the changes i made”.","readClient":"Fires when they keep sending change requests before the deposit — 3 or more, or they carry on after you’ve sent the message once.\n\n⚠️ *Send the message ONCE.* Repeating it teaches them it isn’t real. After that it’s the one-liner, then [[the Decision Tree|tree]] close.\n\nStays *warm* the whole way through. Someone still sending changes has not gone cold — they’re getting the site they want for free until you confirm.","scripts":[{"n":"The message — send this ONCE","t":"yes, noted on those changes. let's confirm the project first, then you can send the full list of changes through your revision portal and we'll work through it\n\nyou get 3 full rounds of revisions for the agreed site. shall we start the project?","sit":"*Lead with the yes, then the process.* The revision link is real — you’re not brushing them off, you’re describing the system they actually get.\n\n⛔ Never open with “save your comments for later” — right policy, wrong first sentence, it reads as shut up.","id":"s0"},{"n":"Every request after that","t":"noted, added to the list","sit":"The whole reply. No debating, no re-explaining, no “yeah we can do that”.\n\nStill going days later? → *The Decision Tree*, send the price close.","id":"s1"}],"next":[{"l":"They’re Ready → Proceed + Invoice","to":"close"},{"l":"Still Not Stopping → The Decision Tree","to":"tree"},{"l":"They Push On Price","to":"price"},{"l":"They Went Quiet After This","to":"followup"}]},"tagging":{"title":"Tagging Convention","kind":"tagging","do":"Tag EVERY lead the moment they reply, no exceptions. Your phone can't save contacts, so the tags ARE how we track who's who and what stage they're at. Update the tag every time the stage changes.","lead":"Every lead gets the <b>Lead</b> tag the moment they reply. No exceptions.","steps":[{"w":"They reply, or send their info (business, logo, or site)","add":[["Lead","#1AA7A0"],["Pending Sample","#EFB32F"]],"why":"Lead is your saved contact now (your phone can't save it) and it stays on the whole way. Pending Sample means you still owe them the live build."},{"w":"You send them the sample","swap":[["Pending Sample","#EFB32F"],["Sent Sample","#AC8673"]],"why":"The ball is in their court now, you're waiting on their reaction.","log":"if they react well"},{"w":"No info after you follow up twice","add":[["Dead Lead","#24353F"]],"why":"Two nudges with no info means they're not serious. Tagging Dead keeps your live list clean.","note":"Then <b>archive</b> the chat."},{"w":"They book a meeting or call","add":[["Meeting Booked","#1FD365"]],"why":"A booked call is real intent, this flags who to prep for.","log":true},{"w":"They look likely to buy","sub":"from the meeting, or they said they want it even without one","add":[["WARM","#791F39"]],"why":"Likely buyers are your most valuable leads, WARM is who you chase hardest.","log":true},{"w":"Deposit paid","add":[["WON","#FE8A8B"]],"why":"Deposit paid means it's locked, not just talk."}],"doctext":"For <b>WARM</b>, <b>Meeting Booked</b>, and <b>Sent Sample</b> (if they react well): jot their <b>number + key info</b> in the tracker doc. No format, just keep it updated. This is how we see the leads that actually matter.","docurl":"https://docs.google.com/document/d/10j826xTjXoXd4m9N1mhuOjSb0JGnhwBGk8jRkP3SnOg/edit?tab=t.0","foot":["Tag every lead <b>Lead</b> plus its current stage.","Keep following up until they buy or go Dead."]},"newlead":{"title":"New Lead: What To Open With","tag":null,"label":"pending sample","intake":["*Business name + what they do* is the minimum. An existing website can supply it.","Logo, photos, existing website or socials if available. Do not ask again for what was sent.","Reference design if they have one. Optional, not homework.","Confirm location only if it is unclear.","Check on-site checkout only if they mention selling or taking payments online."],"do":"SPEED RULE: an FB ad lead is hot for minutes, not hours. Answer in under 10 min, never let a qualified lead sit overnight. Got the information but the build is pending? Acknowledge receipt once. Do not send a missing-info nudge. When the build starts, use the existing Building message.\n\nDon't lead with a form-wall, that's the cheap-guy move. Open human, lead with what THEY get: a real site, live, before they pay. Then get them talking. If they cold-open with \"how much?\", answer that one line first, then still steer to building it live.","readClient":"If they opened with a specific question (price, time), answer that ONE line first, then ask the business question. Don't ignore what they asked just to run your script.","scripts":[{"n":"Default opener, outcome + risk reversal","t":"hey! we'll build your site *live*, free, before you pay a cent.\nwhat's your business + what do you do?","id":"s0"},{"n":"They opened with \"how much?\"","t":"hey 🙂 it's *$590* for a full site\npages, mobile, contact form, 1yr hosting + domain + email\neasiest is we just build *yours* live so you see it first\nwhat's your business + what do you do?","sit":"only when they cold-open with a price question before anything else","id":"s1"}],"next":[{"l":"They Replied → Get Their Info","to":"gotinfo"},{"l":"They Went Quiet","to":"silent"}]},"gotinfo":{"title":"They Replied: Get Their Info","tag":null,"label":"pending sample","do":"the ONLY goal of this phase is to get their custom website BUILT and live. every message here serves that. (internally we call it a sample. to the lead that word does not exist, and neither does \"free\" or \"preview\". to them it is their custom website, always.)\n\nyou cannot build a website for \"service\". you need the actual TRADE: landscaping, plumbing, curtains, aircon, interior design. \"we are in service line\" is UNBUILDABLE. that makes them STUCK, not dead. vague on its own is never a time-waster tell, most owners are just typing between jobs. go get the trade, don't tag them dead.\n\nget the trade from what they ALREADY sent first. sent their site? the trade is on it, go read it. never ask a man for what his own website already tells you.\n\nread what they just sent FIRST, then only chase what's still *missing* — *never re-ask what they already gave.* (the bug: lead sends their site, we reply \"send your site + logo\" — looks like a bot, kills it.)\n\nminimum: know the business name and what it does. Their existing website can give you that. A logo and reference design help if available, but are not required. Ask only for the missing piece.\n\nnever bring up price, pages or hosting YOURSELF. if they ask, answer each outstanding question briefly, then come back to the actual next step. dodging a straight price question reads as a scam.\n\nthe buttons are starting points, not scripts — read their actual reply and freestyle off it. normal questions about pricing, ownership, platform or editing are not a time-waster signal. If there is a genuine repeated problem, flag the actual behaviour.","scripts":[{"n":"They have a website — get the link","t":"send me your website link and i'll take a look. we'll sharpen the design + set it up to actually get found on google","sit":"they have a site — just get the link (you reuse their logo + photos off it, so don't also ask for a logo). already sent the link? don't re-ask, just say you're on it. (got nice work in their industry? you can add a line: \"by the way here's some work we're doing in your industry 👇 «link»\".)","id":"s0"},{"n":"No website — get the logo","t":"nice — i'll build it from scratch. got a logo? drop it here and i'll build around it, no stress if you don't","sit":"no site yet. they usually already said what they do at the opener, so ONLY ask for the logo. add \"and one line, what do you do?\" only if you genuinely still don't know","id":"s1"},{"n":"They want a shop / checkout — qualify first","t":"quick one so i build the right thing — do people actually pay + check out *on* the site itself? or do you just show your products and they pay elsewhere?","sit":"Only if they want to sell products. Product pages and contact buttons are normal website scope. For cart/payment on the site, use [[The $500 e-commerce answer|close_asks/s3]].","id":"s2"},{"n":"Smells like a time-waster — don't chase","t":"all good, no pressure. i'll leave it here — message me if you want the site built and i'll sort it","sit":"Only for a genuine repeated problem after reading the conversation. Normal questions about platform, ownership, price or editing are not proof of bad intent. On-site checkout belongs to the store scope route, not a time-waster label. Nothing built yet: do not mention a live site.","id":"s3"},{"t":"what trade are you in exactly? like landscaping, plumbing, aircon, interior design\njust so i know what i'm looking at before i start","c":"","sit":"They gave you something you cannot build: \"service line\", \"services\", \"we do a bit of everything\", or just a company name. You must be able to say their trade out loud before anything gets built.\n\nKeep the examples if they help explain what detail you need.\n\nA broad umbrella is still vague: \"renovation\", \"construction\", \"engineering\". Ask which part of it they actually do.\n\nASK DIRECTLY. Don't dance around it, don't soften it, don't chat. No trade = no build = nothing happens.\n\nStill missing the trade after asking? Do not start the build. Use the appropriate no-sample follow-up. Questions about price, ownership or the platform are not proof of “recon”.\n\nDon't quote, don't talk pages, don't scope. If they ask price, answer it straight off the faq in one line, then come back to the trade.","id":"s4"}],"next":[{"l":"Business + Trade Known → Build It","to":"building"},{"l":"They Sell + Checkout Online","to":"store"},{"l":"Smells Like A Time-Waster","to":"timewaster"}]},"silent":{"title":"They're Not Replying","tag":{"x":"cool"},"label":"follow up","do":"Pick the stage first. No sample: use [[Sample NOT Sent|spam_nosample]]. Sample shown and no invoice: use [[Sample SENT|spam_sample]]. Invoice out: use [[Payment|payment]]. Do not add a separate nudge from this card. If they replied, answer what they said instead of continuing a silence sequence.","readClient":"A client-provided date overrides the silence ladder. If the brief is complete and the build is pending, this is not a missing-information follow-up.","scripts":[],"next":[{"l":"No Sample Yet","to":"spam_nosample"},{"l":"Sample Shown, No Invoice","to":"spam_sample"},{"l":"Invoice Out","to":"payment"},{"l":"They Replied","to":"gotinfo"}]},"store":{"title":"They Want A Shop / Checkout","tag":{"x":"warm"},"label":"follow up","do":"Check whether they need payments on the site or just product pages. A catalogue with contact buttons or links to an external checkout fits the normal website scope. Standard on-site e-commerce is an extra $500. Use [[The e-commerce answer|close_asks/s3]]. Check unusual integrations before confirming them.","readClient":"Do not upsell checkout when they only want to show products. Explain the contact-first option and the optional $500 upgrade. The client handles the payment-provider account and ongoing products/orders; confirm the actual scope before adding checkout.","scripts":[{"t":"quick one so i build the right thing — do people actually pay + check out *on* the site itself? or do you just show your products and they pay elsewhere?","id":"s0"}],"next":[{"l":"On-Site Checkout → $500 Add-On","to":"close_asks/s3"},{"l":"Catalogue / Contact First → Build","to":"gotinfo"}]},"building":{"title":"It's Building","tag":null,"label":"pending sample","do":"you build nothing, the system does. drop one holding line so there's no dead air, then wait for the live link. don't over-explain, just keep them warm.","scripts":[{"t":"building your site now, gonna make it beautiful, will send you the live link shortly\nstay tuned you will be amazed 💪🏻","id":"s0"}],"next":[{"l":"It's Live → Send It","to":"reveal"}]},"reveal":{"title":"Send Them The Live Site","tag":{"x":"cool"},"label":"sample sent","do":"it's their real live site, never call it a sample. send BOTH messages together: the link, then the question. no price, no expiry here, that comes after they react. only edit the «link».","readClient":"fire back fast and excited? go straight to close. open it and say nothing? not a no, just busy. don't fill the silence, let the follow-up do the work.","scripts":[{"n":"Message 1, send the link","t":"made your site, it's live 👉\n«link»","id":"s0"},{"n":"Message 2, send right after","t":"what do you think? anything you want to change, i'll sort it out","id":"s1"}],"next":[{"l":"Read How They React","to":"telemetry"}],"combo":"Send both messages, one right after the other"},"telemetry":{"title":"They Saw It: Read The Reaction","tag":null,"label":"sample sent","do":"don't ask 'how urgent is this?', read it. the first 1 to 2 replies set the temperature. a normal change request is a buying signal. Use the [[Price + confirmation|tree/s0]], not an automatic invoice. Answer any outstanding question first. A clear yes then goes to invoice details. only a real price haggle goes to price. unsure? default warm. cold is a pattern (2+ tells), never one slow reply. hot means close in the same convo today, warmth's half-life is hours. warm and cold-silent both press the nurture button; only a hard 2+ tell pattern is a time-waster.","readClient":"*🔥 HOT, close TODAY*\n\"wah nice\" / \"looks good\" / ANY tweak (change colour, add logo, put my number) / asks about their own stuff (is this my domain, got the whatsapp button, can i get the email) / \"how much?\" AFTER praising / forwards it / fast multi-message replies.\n\n*🌤 WARM, one soft ask now then cadence*\n\"ok thanks will look\" / \"noted\" / 👍 then quiet / \"looks ok\" / a genuine \"check with my partner\" gets a useful approval next step, not an immediate invoice.\n\n*🧊 COLD or SUSPECT, qualify first*\nhaggles BEFORE complimenting / won't give one input after 2 asks paired with a hard tell / ghosts then only haggles.\nsilence on assets alone is NOT cold, busy owners are just slow to dig out a logo.","scripts":[],"next":[{"l":"🧭 The Decision Tree","to":"tree"},{"l":"Likes It / Wants Changes → Price + Confirmation","to":"tree"},{"l":"Pushes On Price (Real Haggle)","to":"price"},{"l":"Neutral Question (No Praise Yet)","to":"faq"},{"l":"Wants To Call Or Meet","to":"meet"},{"l":"Warm, Quiet, Or Checking With Someone","to":"followup"},{"l":"Haggling Pattern (2+ Tells)","to":"timewaster"}]},"close":{"title":"They Like It: Proceed + Invoice","tag":{"x":"hot"},"label":"closed, invoice","do":"⭐ *say the price BEFORE you ask for the invoice.* never \"shall i send you the invoice?\" on its own — the price, what's included, and the deposit go in the SAME message. read 🧭 The Decision Tree below if unsure.\n\nthey're warm 🙂 don't dump everything on them.\npick what's happening below and you'll get the right lines.\ncore idea: small yeses, not one big ask.\nthe *company name* + the *deposit* are the actual close.","readClient":"clear yes? go straight to the ladder, get the *company name*, don't re-sell.\nthey wobbled? open \"they hesitated\".\nthe deposit is what locks the slot, not the invoice. drive to that.\nnever offer the −$100 to save it, that's Julian's call only.","scripts":[{"n":"⭐ THEY JUST SAID THEY'RE READY — STOP SELLING","sit":"Use after a genuine yes or an explicit invoice request, with the price already clear.\n\nRead the whole message, not just a trigger phrase. ‘What is the deposit?’ needs the amount answered. A normal change request uses the [[Price + confirmation|tree/s0]].\n\n‘I'm ready to proceed, but how do I send photos?’ is already yes. Answer the process question, then ask for invoice details. Do not ask for another yes.\n\n‘I want it, but my partner must approve first’ has an unresolved condition. Help them get that approval.\n\nAnswer all outstanding questions before moving on. If the company name is already known, use it.","t":"perfect, what’s the company name to put on the invoice?","id":"s0"},{"n":"⭐ THEY'RE READY — BUT WORRIED ABOUT SENDING THEIR INFO","sit":"Use when they have agreed to proceed but are worried about gathering or sending their photos and information. Explain the portal, then collect invoice details.\n\nIf they have only asked about the process and have not agreed, use the readiness answer under Unstick It with its confirmation ending.\n\nDo not treat missing photos as a reason to give them a big preparation task. This is not the reply to a partner-approval condition or an explicit later date.","t":"no problem, you don't need to gather everything first. once the deposit's in, i'll send you the link to upload your photos and info, and we'll sort it from there\n\nwhat's the company name for the invoice?","id":"s1"},{"n":"What happens after payment?","t":"once the deposit's in, we'll polish the design and make the changes you've requested, then send you your revision portal so we can finish the site together","sit":"Only if they ask about the next steps. Do not add a process speech to a simple yes.","id":"s2"}],"next":[{"l":"🧭 The Decision Tree","to":"tree"},{"l":"▶ Walk Them Up The Ladder (The Close)","to":"close_ladder"},{"l":"They Hesitated Or Objected","to":"close_wobble"},{"l":"They Asked A Question (Pay, Feature, Quote)","to":"close_asks"},{"l":"Wants A Call Or Meet","to":"meet"},{"l":"Turns Into A Haggle","to":"price"}]},"close_ladder":{"title":"The Close, Walk Them Up The Ladder","tag":{"x":"hot"},"label":"closed, invoice","do":"A normal change request is a buying signal, not a request for a whole free revision round.\n1. Use the existing price + confirmation message in [[the Decision Tree|tree]]. Do not detour into choosing a domain.\n2. On a clear yes, get the company name if missing and issue the invoice through the existing process.\n3. Once the deposit is in, polish the design and do requested changes, then set up the revision portal. The sample is already the first draft.\n\nSkip repeating the price close if they have already clearly agreed and know the price. Answer any outstanding question first.","readClient":"the deposit locks the slot, not the invoice. keep moving till it's in.\nskip the value stack on a clear yes.\nanchor *$590* once, in writing, before the word invoice lands.","scripts":[{"n":"Ping Julian (internal, NOT the client)","t":"closed 🎉 «business»\ndomain: «name».com\ninvoice to: «company name»\ntarget completion around 5 days with timely revision feedback","sit":"internal message to Julian only, never send to the client","id":"s3"}],"next":[{"l":"Deposit Confirmed → Onboarding","to":"onboarding"},{"l":"They Hesitated → Handle It","to":"close_wobble"},{"l":"They Asked Something","to":"close_asks"}]},"close_wobble":{"title":"The Close, They Hesitated Or Objected","tag":{"x":"warm"},"label":"closed, invoice","do":"they like it but stalled. don't push.\n\nanswer the exact blocker, lean on value plus the fact they've already SEEN their real site. if they gave a real date, acknowledge it and follow up then. If they go silent without a date, use the sample ladder, or Payment if an invoice is out. \"let me think\" comes first, diagnose the real blocker before anything else.","readClient":"One value rung, not five. Diagnose before you sell. If they grind price before valuing anything, that's the time-waster tell. Never offer the discount, that's Julian's call only.","scripts":[{"n":"They need time: agree one check-in","t":"no problem, i'll check back on «their day»","id":"s0"},{"n":"They give a genuine later start date","t":"sure, i'll check back on the 1st and we can pick it up then","id":"s1"},{"n":"\"what if i pay and don't like it?\"","t":"yes, you get 3 full rounds of revisions to get the design and content how you want them","id":"s2"},{"n":"Value stack (only if they ask what they get)","t":"all in for *$590*:\nup to 8 pages, mobile-optimised\nSEO setup to help your business get found on google\ncontact form to your phone + whatsapp button\n1yr free hosting, domain + email\n3 rounds of revisions\naim to complete in around 5 days with your revision feedback on time","id":"s3"},{"n":"Dream outcome (emotional / visual buyer)","t":"when someone opens your website, they'll see your services, your work and how to contact you, all in one professional site","id":"s4"}],"asset":[{"src":"whats-included-fullseo.png","cap":"The full $590 package. Save it once, send on WhatsApp."}],"next":[{"l":"Warmed Up → Back To The Ladder","to":"close_ladder"},{"l":"Still Deferring → Follow-Up Cadence","to":"followup"},{"l":"Turns Into A Haggle","to":"price"}]},"close_asks":{"title":"The Close, They Asked A Question","tag":null,"label":"closed, invoice","do":"Answer the actual question before closing. If they have already agreed and just need a process answer, answer it and collect invoice details. A quote request gets a quote; a call is optional. Resolve a must-have feature before taking payment.","readClient":"Keep each answer short, but answer everything outstanding. Cart or checkout on the site uses the $500 e-commerce answer below. Do not use a keyword as automatic permission to invoice.","scripts":[{"n":"\"how / when do i pay?\"","t":"the deposit is 70%, so $413. once it's in, we polish the design and work through your changes and revisions. the remaining $177 is invoiced when the site goes live","id":"s0"},{"n":"\"send me a proper quote / proposal\"","t":"yes, i'll send the quotation with the scope and pricing so you can review it","sit":"Use client-proposal in Agent Operations.\n• Sample sent: generate the PDF from its current pages and sections.\n• Extra pages requested: include the agreed additions in the proposal.\n• No sample yet: use known scope; ask only for what is missing.\nNo compulsory call. The PDF records the agreed site.","id":"s1"},{"n":"\"can you add [a feature]?\" (booking, gallery, map, reviews)","t":"yes, we can add that «known included feature»","sit":"Known included feature? Say yes. Standard enquiry forms already send email notifications. Unknown integration? Ask which system or workflow, and check before confirming. Do not automatically upsell an ordinary feature or sell the wrong site first. Existing agreed page/scope limits still apply.","id":"s2"},{"n":"On-site checkout: $500 e-commerce add-on","t":"checkout on the site is an extra $500 for ecommerce features, on top of the $590 website\n\ni'd suggest starting with product pages where customers can click in and contact you first. you can add the $500 ecommerce upgrade later when you're ready to take orders online","sit":"Standard e-commerce is an extra $500, not included in $590. Confirm requirements before invoicing the add-on; unusual payment or custom workflows need a scope check. A product catalogue with contact buttons stays a website, not a checkout build.","id":"s3"},{"n":"Unknown integration: need the system name","t":"which system are you using? i'll check the connection before we confirm it","sit":"Only when the integration is not already understood. Standard form email notifications do not need this check.","id":"s4"}],"next":[{"l":"Answered → Back To The Ladder","to":"close_ladder"},{"l":"Back To The Close","to":"close"}]},"meet":{"title":"They Want To Meet / Call","tag":{"x":"hot"},"label":"sample sent","do":"Offer a Google Meet so you can share the screen and walk through the site. Use one ten-minute booking message. Offer two real available times only if the client has not already given a workable time. Text is still an option. A quote request does not require a call. Do not promise whole-team attendance or live changes unless arranged.","readClient":"A meet ask is hot, don't cool it with admin. Swap in your real free windows for the two slots. Offer text as an easy fallback. A booked call keeps the current label (ball's with them to show up); a no-show flips to follow up.","scripts":[{"n":"They ask to meet in person (any reason)","sit":"For an in-person request, explain the online option first. If they agree, use [[Google Meet booking|meet/s2]]. If they still want in-person, use [[Check availability|meet/s5]].","t":"we normally go through it on google meet so we can share the screen and look at your site together. it's a lot more efficient\n\nwould that work for you?","id":"s0"},{"n":"“where's your office?”","sit":"*USE WHEN they ask where you're based.*\n\nSay it plainly. Never hide it, never dodge — a straight answer builds more trust than a vague one.\n\nThen steer straight back to booking the google meet.","t":"we have a virtual office based in woodlands","id":"s1"},{"n":"Say yes, 2 slots + text fallback","t":"happy to walk you through it on google meet. 10 mins and you can ask anything\n\ndoes «first available time» or «second available time» work?","sit":"Use when a call would help and no time is agreed. Replace both slots with real availability. If they already offered a time that works, accept it. If they prefer text, continue there.","id":"s2"},{"n":"Their proposed time works","t":"yes, «agreed time» works. i'll send the meet link","id":"s4"},{"n":"They still insist on in-person","t":"understood, let me check whether we can arrange an in-person meeting","sit":"Refer the request internally. Do not promise a director or specific meeting.","id":"s5"}],"next":[{"l":"On The Call → Close","to":"close"},{"l":"No-Show → Follow Up","to":"followup"}]},"followup":{"title":"Went Quiet After Seeing It","tag":{"x":"cool"},"label":"follow up","do":"This card handles a response, a real date or partner approval. It does not run an extra chase schedule.\n\nSilent and no sample? Use Sample NOT Sent. Sample shown, no invoice? Use Sample SENT. Invoice out? Use Payment only.\n\nWhen they reply, stop the silence sequence and read the message. A real agreed date takes priority. A clear no or stop request ends outreach. No monthly-forever chase after the ladder.\n\nUse the one-shot silence probe only under its existing conditions: prior engagement, finished sample ladder, preview actually offline. It does not extend the unpaid-invoice schedule.","readClient":"For partner approval, send the site and a forwardable price/inclusions summary, then establish when they will review if unknown. A group chat or joint call is optional, not a compulsory chain. For ordinary silence, use the correct dedicated ladder.","scripts":[{"n":"A date THEY gave you has arrived","sit":"Use on the actual agreed non-payment check-in day. Refer to their real timing. If no sample was built, ask about the outstanding next step, not whether they saw a website. An unpaid invoice belongs to Payment.","t":"hi, you mentioned «their actual timing». have you had a chance to look through the site?","id":"s1"},{"n":"They're checking with a partner / boss","t":"sure, send them this together with the site link:\n\n$590 for the website and seo setup, with hosting, domain and business email free for the first year. 70% deposit is $413, then we work through your changes\n\nwhen will you both be looking at it?","id":"s4"},{"n":"Optional: include the partner in a group","sit":"Optional if a group would help or they offer to create one. Do not make this a requirement. If no group is created, they still have the site, summary and an agreed next step.","t":"perhaps you could create a group chat, so we're all on the same page over here 🙂\nand i can explain the key points","id":"s5"},{"n":"Optional: a joint call helps resolve approval","sit":"If a joint walkthrough would help, use [[Google Meet booking: two available times|meet/s2]]. A repeated partner dependency alone does not prove a fake objection.","t":"","id":"s6","route":"meet/s2"},{"n":"Partner reviewed it, but still has a concern","t":"what does your partner need to be comfortable going ahead? i can answer it directly or put the details in a quotation","id":"s8"}],"next":[{"l":"Still Stalling → Unstick It","to":"lever"},{"l":"Replies → Re-Read Temperature","to":"telemetry"},{"l":"Warms Back Up → Close","to":"close"},{"l":"Silent, Sample Shown","to":"spam_sample"},{"l":"Invoice Out","to":"payment"}]},"credibility":{"title":"They're Not Sure We're Real","tag":{"x":"warm"},"label":"doubt / reduce my exposure","do":"Answer the actual trust question first: office, payment split, ownership and tools are different questions. Do not answer all of them with a long company block.\n\nIf they want company proof, send the short portfolio/reviews message. Hold the standard 70/30 split unless Julian approves an exception. Do not attach a deadline to fear. Do not promise director attendance or client reference calls without agreement.","readClient":"Read what they actually asked. A payment-split question is not automatically a scam accusation. Show evidence they can inspect: their own site, client reviews, relevant portfolio, and company registration when asked.","scripts":[{"n":"They want company evidence","sit":"Answer any factual question first. Use one short proof message if they want reassurance. Portfolio link is confirmed. Verify the existing client-review link before the final approved release; do not send a placeholder.","t":"we're a registered singapore company. here's our portfolio and client reviews so you can see the work and hear from people who've used us:\n\nportfolio: https://reputifly.com/portfolio/\nreviews: https://maps.app.goo.gl/v34maWPeR28V5H6Z7","id":"s0"},{"n":"Prefix — only if they asked to change the terms","sit":"Use when they ask for a different payment split. Keep the existing 70/30 answer. Add company proof only if they actually asked for reassurance; it is not compulsory after every payment question.","t":"we keep it at 70/30 for every client.","id":"s1"},{"n":"They directly ask whether AI is used","t":"yes, we use ai tools, with us directing the build. the site is customised for your business, not taken from a ready-made template","sit":"Do not volunteer this in the opener. If the issue is a photo, address the photo.","id":"s2"}],"next":[{"l":"They went quiet after this","to":"followup"},{"l":"They want a discount instead","to":"lever"},{"l":"Invoice is out, no money","to":"payment"}],"attachments":[{"type":"pdf","label":"Proof: the Google + AI case study","url":"../upsell-playbook/Reputifly-Case-Study-Google-and-AI-Results.pdf","file":"Reputifly Case Study - Google and AI Results.pdf"}],"portfolioExamples":[{"industry":"Interior Design","url":"https://reputifly.com/portfolio/dots-n-tots/"},{"industry":"Florist","url":"https://reputifly.com/portfolio/bespokeblooms/"},{"industry":"Spa","url":"https://reputifly.com/portfolio/ancient-dynasty-spa/"},{"industry":"No Matching Industry","url":"https://reputifly.com/portfolio/"}]},"price":{"title":"Price Pushback / Cheaper Guy","tag":{"x":"warm"},"label":"follow up","img":"seo-proof.webp","imgcap":"His & Her Hairloft by Jamie · 6,250 Google Clicks Over The Period Shown","do":"HOLD *$590*. Lead with relevant work and evidence, not an apology. Use the case study for price/value or search-proof questions. Use one relevant portfolio for a design question. If their sample is already shown, bring the comparison back to their actual site. Do not resend proof endlessly or guess what competitors deliver. If they keep grinding after the value answer, flag Julian. Cash discounts remain Julian's decision.\n\nSample already shown? [[Copy the $590 value answer|price/s2]]. Ongoing support follows [[Included updates|faq/s9]].","readClient":"\"Can you do better on price?\" is usually a reflex, not a wall. Re-anchor on proof once. If they grind a second time, stop selling, go quiet, flag Julian. Grinding before valuing anything is the time-waster tell.","scripts":[{"n":"⭐ “vendor X is only $290” / “what's the difference?”","sit":"Use when they ask what makes you different or name a cheaper quote. If no sample exists, use this build-first invitation. If their sample was shown, use the case-study message below. If they genuinely need another person's approval, help them forward the site and summary. The word “we” alone does not prove lack of authority.","t":"you don't have to choose us based on a promise. we build your site first so you can see the design before paying. here's some of our work so you can see the standard","id":"s0"},{"n":"Proof: attach the case-study PDF, after their sample is shown","t":"have a look at this. we built this client's website and also handled additional seo work. you can see their google results, ai mentions and actual search traffic\n\nand you've already seen the site we've built for your own business before paying anything. that's the work you're comparing for $590","sit":"Use for a cheaper-price, why-us or search-proof objection. Attach the supplied case-study PDF once. Use the already-built sentence only after their sample was shown. This client also received additional SEO work; do not label total-period clicks as monthly visitors. PDF pending: do not send this attachment message until the file is available. Meanwhile use [[The $590 value answer|price/s2]].","id":"s1"},{"n":"After the sample: what the $590 covers","t":"with us, you've already seen the actual site we're building for your business before paying\n\nthe $590 includes the build, seo setup and first year of hosting, domain and email. we handle the work after too","id":"s2","sit":"Use after the client has seen their sample. This is the value answer, not another discount offer."},{"n":"“my nephew / Wix can do it cheaper” (DIY)","t":"you can. with us, you're paying for the design and setup to be handled for you, with a site built around your business. you've already seen yours, and the case study shows more of the work we've done","sit":"Only for a cheaper DIY/Wix option. If their sample was shown, use [[What the $590 covers|price/s2]]. Do not imply a case study has been sent if it has not.","id":"s3"}],"next":[{"l":"Cleared, They're Warming → Close","to":"close"},{"l":"🎁 Offer The Free Year","to":"lever"},{"l":"Only Wants Cheaper → Flag Julian","to":"timewaster"},{"l":"Went Quiet","to":"followup"}],"attachments":[{"type":"pdf","label":"Proof: the Google + AI case study","url":"../upsell-playbook/Reputifly-Case-Study-Google-and-AI-Results.pdf","file":"Reputifly Case Study - Google and AI Results.pdf"}]},"lever":{"title":"They're Stalling: Unstick It","tag":{"x":"warm"},"label":"warm","do":"⛔ *Invoice already out and waiting on money? That is not this card.* Use *Invoice Out, No Money Yet* below.\n\n*The lead has gone soft. Pick the reason below — the fix is different for each.*\n\n⚠️ If they went quiet and NEVER said yes → that's not this card.\nUse the dedicated sample follow-up ladder. The preview wind-down lives there.\n\n*THE ONE LEVER:* one extra year of hosting. That is the only thing you may ever add to a deal.\nThe $590 NEVER moves. No cash discounts, ever — that's Julian's call alone.\n\n• Wrong moment, not wrong words. This card fails when it is pulled too early, never because the offer is bad.\n• ⛔ Never defend a price nobody attacked. If they have NOT asked for a discount, do not say \"that's the most i can do\" — you are answering an objection they never made, and it tells them there is a negotiation to win.\n• ⛔ The deadline is allowed — but ONLY on someone who can say yes today. The red box applies to the confirm-today offer only.\n• Never extend it. If they don't take it, drop it and go back to normal follow-up.\n• One per deal. Never stacked. Never after the invoice is out.\n• Log every use in the daily digest.\n\n*Hosting price:* $240/year, first year free. Same number to everyone — there is no second price.\nBilling starts year 2. If the extra free year was given, year 3.\nIf they quote an older ad at $120 → then it's $120. No argument. It was advertised.","scripts":[{"n":"They're keen — but never officially confirmed","sit":"Use the confirm-today offer only when they want the site but have not yet agreed to start, can make the decision today, and have no unresolved question or stated approval/payment constraint. An actual yes goes to invoice details, not another offer. No invoice already out.\n\nA genuine later start date gets its dated next step, not this offer. The word “we” alone does not establish a separate approver. A direct discount question has its own answer below.\n\nUse once, no stacking. Keep the price fixed unless Julian approves a cash discount.","t":"if we can confirm today i can include an extra year of hosting free","id":"s0"},{"n":"“we're not ready yet” / “need to get our things together”","sit":"Use for someone who thinks they must gather photos or information before starting. Explain the portal.\n\nIf they already clearly agreed, use the Close readiness answer and go to invoice details. If not, answer the process question and ask whether to start.\n\n“What is the deposit?” gets the amount answered, not an automatic invoice. An explicit later date, travel or partner approval is a different situation.","t":"no need to gather everything first. once the deposit's in, i'll send you the link to upload your photos and info, and we'll sort it from there\n\nshall we start the project?","id":"s1"},{"n":"They ask for a discount / mention a cheaper guy","sit":"*USE WHEN they ask for money off directly:*\n\n•  \"can you do cheaper\"\n•  \"any discount\"\n•  \"my budget is X\"\n•  \"someone quoted me less\"\n\nNever counter with cash. Redirect to the lever ONCE, then stop talking.\n\n⛔  If they keep grinding after this → flag Julian.\n      Do not negotiate further. Do not invent anything.","t":"the $590 is fixed sorry\nwhat i can do is an extra year of hosting free","id":"s2"}],"next":[{"l":"Invoice Is Out, No Money Yet","to":"payment"},{"l":"They Confirmed → Close + Invoice","to":"close"},{"l":"Quiet, Never Said Yes → Went Quiet","to":"followup"},{"l":"Still Grinding On Price","to":"price"},{"l":"🧭 The Decision Tree","to":"tree"}],"treeHtml":"<div class=\"lv-go\"><div class=\"lv-h\">Use The Confirm-Today Offer Only When All Three Are True</div><div class=\"lv-ok\"><span>&#10003;</span><div>They want the site but have <b>not yet agreed to start</b>. An actual yes goes to invoice details, not another offer.</div></div><div class=\"lv-ok\"><span>&#10003;</span><div>They have <b>stopped asking questions</b></div></div><div class=\"lv-ok\"><span>&#10003;</span><div>They can say yes <b>themselves, today</b></div></div></div><div class=\"lv-no\"><div class=\"lv-h\">Do Not Send The Confirm-Today Offer In These Cases.</div><div class=\"lv-r\"><span class=\"lv-x\">&#10005;</span><div>They are <b>still asking questions</b><div class=\"lv-c\">Answer the question first. If it is a discount question, use the separate discount answer below.</div></div></div><div class=\"lv-r\"><span class=\"lv-x\">&#10005;</span><div>They have named <b>anyone else who decides</b> &mdash; boss, partner, team or spouse whose approval is explicitly required<div class=\"lv-c\">Paul, 13 Aug. He said &ldquo;let me send to my marketing team&rdquo;, got &ldquo;confirm tonight&rdquo;, and replied <b>&ldquo;bro corporate doesnt work this way&rdquo;</b>. Deal lost, about $1,000.</div></div></div><div class=\"lv-r\"><span class=\"lv-x\">&#10005;</span><div>They have named a <b>money or process constraint</b> &mdash; &ldquo;need time to make payment&rdquo;, &ldquo;goes through accounts&rdquo;<div class=\"lv-c\">Wesley, 7 Aug. Same offer, same day. He replied <b>&ldquo;But we need time to make payment.&rdquo;</b></div></div></div><div class=\"lv-r\"><span class=\"lv-x\">&#10005;</span><div>The <b>invoice is already out</b><div class=\"lv-c\">Then you chase. You never sweeten.</div></div></div></div><div class=\"lv-t\"><b>The one test before you send it:</b> could this person say yes in the next hour, on their own, without asking anyone, and without moving money they have already told you they cannot move yet?<br/><br/>If no &mdash; do not use the confirm-today offer. <b>The deadline is not the problem. Firing it at someone who cannot confirm today is.</b></div>"},"faq":{"title":"Common Questions","tag":null,"label":"","do":"Answer every outstanding question briefly, then choose the real next step. A clear yes goes to invoice details; a question gets an answer; an agreed date gets acknowledgement and a wait. Do not add another sales ask after every reply. Keep the current stage and your human voice.\n\nPAGE CAP: 8 is a CEILING, not an entitlement. Always say \"up to 8 pages\". NEVER say \"8 pages included\", \"you get 8 pages\", or \"our package includes 8 pages\" — that turns a cap into something they are owed. The page count is scoped by US from their actual services (home, about, contact + one per main service) and is LOCKED once scoped. That formula is YOURS, never the client's — never tell a client \"a page for each main service\", they will decide what counts. NEVER invite them to save or bank unused pages for later. There is no page bank. An extra page after scoping is a paid add-on and is NOT part of the 3 rounds. Fewer pages NEVER means a lower price.\n\nHOSTING: *$240/year, first year free — same number to everyone.* There is no second price. Billing starts year 2; if the extra free year was given as the closing lever, year 3. Do not volunteer it — answer when asked, then steer back to the site. If they quote an older ad at $120 → then it's $120, no argument. It was advertised.\n\nSEO GUARANTEE: never answer a guarantee question with a leading yes. Your FIRST words answer the GUARANTEE, not the seo. Never claim or agree to a guarantee, a ranking, page 1, number 1, a timeframe or a lead count — you may only use those words to REFUSE. Never estimate months, traffic or leads. Past proof is fine (another client's real google numbers already happened, that is the price node's job). The line is TENSE: what a past client GOT = allowed, what this lead WILL GET = never. Only ever claim the BASIC seo setup inside the $590.\n\nUPTIME: this is the ONE guarantee you are allowed to give — 99.9% uptime, monthly. It is the exception to the rule above, and it is the ONLY exception. Say the number plainly, do not hedge it. But the compensation is ALWAYS free hosting time, never money: 7 days free hosting if we fall under 99.9% in a month, 15 days under 99%, 30 days under 95%. NEVER quote a dollar refund. NEVER agree to cover lost sales, lost bookings, lost customers, lost data or lost business — the free hosting credit is the ONLY thing we ever owe, and that is the whole point of having a number. Scheduled maintenance, their expired domain, and anything on their side or a third party's side do not count as downtime. If a client claims a loss, asks for cash, or disputes our uptime figure → do not negotiate, flag Julian.\n\nEMAIL RENEWAL: standard business email is included in the hosting renewal. No separate standard email renewal charge. Keep the existing shared storage and quantity rules.","scripts":[{"n":"“How much is hosting?”","t":"$240/year, first year is free\nour servers are in singapore so the speed is very fast","id":"s0"},{"n":"“what's the uptime guarantee?”","t":"we guarantee 99.9% uptime and monitor the servers 24/7\nour servers are in singapore so it's fast and stable","sit":"Say the number, then stop. Do NOT volunteer the compensation — that is the NEXT script, and only if they ask. Never add \"basically never goes down\", never promise it will never go down, never give an example of a past outage.","id":"s1"},{"n":"“what if you don't hit 99.9%?”","t":"if we fall below it in a month we add free hosting time to your account\nyou don't have to chase us for it, we track it","sit":"⛔ THE GUARDRAIL. The compensation is FREE HOSTING TIME. Never a dollar figure, never a refund, never cash. NEVER agree that you will cover lost sales, lost bookings, lost customers or lost business — that is the one answer that can actually cost Julian money. If they push for money, quote a loss, or say \"what about the sales i lost\" → do NOT negotiate, do NOT apologise with a number, flag Julian. You may also say the exact days: 7 days free hosting if we're under 99.9%, 15 if under 99%, 30 if under 95%. Do not invent any other number.","id":"s2"},{"n":"“Do I own it?”","t":"yes, you own the full website once the build is finished\nwe're the ones running it and doing the work on it, hosting included","sit":"Ownership and operator in one breath. \"Run\" is the verb. If you compress this to \"we're basically just the admin\" you have just described the competitor and thrown away the whole moat.","id":"s3"},{"n":"“what happens to our hosting if your company stops operating?”","sit":"*USE WHEN they ask about business continuity* — what if you shut down, what if you disappear, who holds our site.\n\nThis is a CONTINGENCY question (\"what if you stop\"), NOT a probability question (\"will you stop\").\nAnswer it mechanically. Show them the exit exists. Do NOT try to reassure them that we're fine.\n\n⛔  NEVER discuss company finances. No revenue, no profit, no \"we make more than it costs us\".\n      An unprovable money claim reads as defensive and invites \"so how much do you make?\"\n\n⛔  NEVER name another client or their contract.\n\n⛔  NEVER promise the company will operate forever.\n\n✅  \"100+ sites on our own servers\" is a fact they can check. Scale signals permanence better than profit does.\n\n→  If they keep pushing after this, flag Julian.","t":"if you need to move, we can provide the website export free. it's built on wordpress. your new provider or developer handles hosting and ongoing support after the move","id":"s4"},{"n":"“How long does it take?”","t":"it takes around 5 days to complete as long as you can provide your revision comments on time","id":"s5"},{"n":"“What's included?” (send the graphic above + this)","t":"here is the package, let me know if you have any questions","img":"whats-included-fullseo.png","id":"s6"},{"n":"“are you legit / is this a scam?”","t":"we're a registered singapore company. here's our portfolio and client reviews so you can see the work and hear from people who've used us:\n\nportfolio: https://reputifly.com/portfolio/\nreviews: https://maps.app.goo.gl/v34maWPeR28V5H6Z7","id":"s7"},{"n":"“is it one-time or monthly? any hidden fees?”","t":"the website is a one-time $590. hosting, domain and business email are free for the first year\n\nafter that, hosting is $240/year, including business email. the domain is $16/year","id":"s8"},{"n":"“who maintains it / changes later?”","t":"while your site is hosted with us, edits to existing text and replacing existing photos with yours are free of charge. however, new pages and new custom features are quoted separately","id":"s9"},{"n":"“can my staff get email too? how many?”","t":"you can get as many domain email addresses (yourname@domain.com) as you want with a combined limit of 40gb","id":"s10"},{"n":"“can i see more examples / your portfolio?”","t":"here's a selection of our work so you can see the design quality across different businesses:\nhttps://reputifly.com/portfolio/","id":"s11"},{"n":"“I already have my own hosting / domain”","t":"yes, you can keep your own hosting. the website build is still $590, and you continue renewing the hosting with your provider","id":"s12","sit":"If they ask about support after moving: ongoing support and free text/photo updates apply only while hosted with us. [[Free export and support boundary|faq/s4]]."},{"n":"“How many pages do I get?”","t":"up to 8 pages, planned around what your business needs","sit":"They asked for the number: say up to 8 pages. If their site is already scoped, give the actual count and page names. Do not invent a future page bank. Honour a client-specific written allowance or flag it rather than silently changing it.","id":"s13"},{"n":"“Does it include a landing page?”","t":"yes we design your home page to be the landing page to convert leads","id":"s14"},{"n":"“Does it include my Google reviews?”","t":"we pull in your actual google reviews it automatically updates","id":"s15"},{"t":"up to 8 pages, planned around what your business needs","c":"","sit":"Same answer as the page-count question. If the scope is already fixed, state the actual page count. If a different allowance was promised in writing or they already paid, flag it before correcting their entitlement.","n":"“how many pages max?”","id":"s16"},{"t":"can't guarantee rankings, that part is google's call\nwhat's included is the basic seo setup, we help your site get found on google\n\ndid you get a look at the site we built you?","c":"","sit":"THE MAIN ONE. Your FIRST words answer the guarantee, not the seo. On WhatsApp two short lines send as two messages — if the reassuring half goes first and the refusal never lands, you have said yes. Refusal first, every time.\n\nNever open with \"yes\". Never say \"seo is included\" bare, always \"basic seo setup\". Never estimate months, traffic or leads.\n\nNOTHING BUILT YET? Do NOT end with \"did you get a look at the site we built you?\" — there is no site. Steer to the trade instead: \"what's your trade exactly? plumbing, aircon, curtains? we'll build you a real one so you can see it\"","n":"“can you guarantee rankings?”","id":"s17"},{"t":"page 1 isn't something anyone can guarantee, us or anyone else\nwhat we control is the setup, we build the site so google can read it and find your business","c":"","sit":"The harder version. Never say yes, never say maybe, never say \"we usually get people there\". Say nobody can, then hand them the thing we actually control.","n":"“can you get us on page 1?”","id":"s18"},{"n":"“what counts as one revision?”","sit":"*USE WHEN they ask what a revision is or how many they get.* Straight from our terms — do not improvise this one, a vague scope answer now is an argument in month three.","t":"you get 3 full rounds\n\na round is one list of changes sent through the revision portal, we work through the changes to the agreed site in one go and send it back\n\nsmall stuff like swapping a photo or fixing a typo we just do, that doesn’t use a round\n\nnew pages or new sections are quoted separately","id":"s19"},{"n":"“do you do GEO / AI search?” (before they've paid)","t":"yeah we do that — separate add-on on top of the website\n\n*$499*. we check what ai actually says about you today, build 15 custom AI-ready pages, then run the same check at 90 days so you can see what you're showing up on\n\nhappy to go through it properly once your site's confirmed","sit":"⛔  *USE WHEN they raise AI search / GEO / ChatGPT before the deposit has landed.* Answer it, give the price ONCE, and stop.\n\nNo deadline. No discount. It goes back on the table after the website is confirmed.\n\nThe price is $499. You may not move it — that is Julian's call alone.\nIf a lower number has already been given to this lead, flag Julian. Do not re-quote it yourself.","id":"s20"},{"n":"Is SEO included?","t":"yes, seo setup is included in the $590. we build your site around your services to help customers find your business on google, not just make it look good","sit":"Normal included-setup question, not a guarantee question.","id":"s21"},{"n":"How many months of SEO?","t":"it's a one-time setup built into the website, not a monthly seo campaign. we optimise the site during the build, then set up google search console and submit it for indexing when we launch","sit":"Explain the one-time setup. Do not describe it as ongoing monthly SEO.","id":"s22"},{"n":"What exactly is in the SEO setup?","t":"we structure the pages around your services, set up the headings and page titles, optimise the images, and connect google search console. when the site launches, we submit it for indexing","sit":"Only if they want the technical detail.","id":"s23"},{"n":"Is business-email renewal extra?","t":"business email is included in your hosting renewal. there's no separate standard email renewal charge","sit":"Standard email renewal is part of hosting. Special storage requests are separate and out of this review.","id":"s24"},{"n":"How do I update the site?","t":"you don't need to learn how to edit a website. just type what you want changed in your portal, attach any photos, and we'll handle it","sit":"For ease-of-updating questions. If they specifically ask about WordPress/admin access, answer that directly using the existing access terms.","id":"s25"}],"next":[{"l":"Back To Their Reaction","to":"telemetry"},{"l":"No Trade Yet → Get Their Info","to":"gotinfo"},{"l":"They're Ready → Close","to":"close"}]},"timewaster":{"title":"Smells Like A Time-Waster","tag":{"x":"dead"},"label":"time waster","do":"Tell them apart on BEHAVIOUR, not vibes. Need 2+ tells before writing anyone off. A false-positive on a real buyer costs $590, a false-negative on a waster costs minutes, so bias toward KEEPING them. The decaying live site is the perfect free filter: a real buyer claims it, a waster lets it die. Real-but-cheap gets #1 (the value proof) NEVER the discount. \"Won't give an input after 2 asks\" is NOT a tell on its own (busy SG owners are genuinely slow), it only counts paired with a hard tell.\n\nTHE MOST RELIABLE TELL IS COUNTABLE: *3+ broken promises.* A broken promise is them naming a day or time — for payment, for an answer, for sending info — and it passing with nothing. That is a tally, not a feeling, and it works on everyone. Never write a lead off on a hunch about the kind of person they are; count what they actually did. For an unpaid invoice, use [[Payment|payment]] regardless of broken promises. Do not restart the hosting lever or a different chase.","readClient":"Judge repeated behaviour, not the fact that someone asks questions. Platform, ownership, administrator access, self-hosting and price questions are normal.\n\nA real repeated pattern such as moving the agreed requirements after each answer can be flagged.
